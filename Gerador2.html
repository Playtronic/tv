            emailError.style.display = 'none';
        }
        
        if (!nome || nome.length < 3) {
            nameError.textContent = 'Por favor, insira um nome para a TV (mínimo 3 caracteres).';
            nameError.style.display = 'block';
            isValid = false;
        } else {
            nameError.style.display = 'none';
        }
        
        if (isValid) {
            tvData.email = email;
            tvData.name = nome;
            tvData.slogan = slogan;
            tvData.logo = tvLogoInput.value.trim() || '';
            showScreen('screen2');
        }
    });
    
    toScreen3Btn.addEventListener('click', () => {
        tvData.visibility = visibilitySelect.value;
        tvData.showChannelNameWithLogo = document.getElementById('showChannelNameWithLogo').checked;
        tvData.showTime = showTimeCheckbox.checked;
        tvData.enableRewind10 = enableRewind10Checkbox.checked;
        tvData.enableRestart = enableRestartCheckbox.checked;
        tvData.enableLive = enableLiveCheckbox.checked;
        tvData.enableDebug = enableDebugCheckbox.checked;
        tvData.customReleaseDate = customReleaseDateCheckbox.checked;
        tvData.isAdultContent = adultContentCheckbox.checked;
        
        if (customReleaseDateCheckbox.checked) {
            tvData.releaseDate = releaseDateInput.value;
        } else {
            tvData.releaseDate = '';
        }
        
        showScreen('screen3');
    });
    
    toScreen4Btn.addEventListener('click', () => {
        if (validateScreen3Navigation()) {
            tvData.programmingMode = programmingModeSelect.value;
            
            if (tvData.programmingMode === 'grade') {
                updatePrograms();
            } else {
                updatePlaylistVideos();
            }
            
            showScreen('screen4');
        }
    });
    
    toScreen5Btn.addEventListener('click', () => {
        if (validateScreen4Navigation()) {
            if (!validateCommercialsPerBreak()) {
                return;
            }
            
            tvData.enableCommercials = enableCommercialsCheckbox.checked;
            tvData.commercialsPerBreak = parseInt(commercialsPerBreakInput.value) || 2;
            tvData.commercialsOrder = commercialsOrderSelect.value;
            updateCommercials();
            showScreen('screen5');
        }
    });
    
    toScreen6Btn.addEventListener('click', () => {
        let isValid = true;
        
        const facebookUrl = facebookUrlInput.value.trim();
        if (facebookUrl && !isValidSocialMediaUrl(facebookUrl, 'facebook')) {
            facebookError.style.display = 'block';
            isValid = false;
        } else {
            facebookError.style.display = 'none';
        }
        
        const instagramUrl = instagramUrlInput.value.trim();
        if (instagramUrl && !isValidSocialMediaUrl(instagramUrl, 'instagram')) {
            instagramError.style.display = 'block';
            isValid = false;
        } else {
            instagramError.style.display = 'none';
        }
        
        const blueskyUrl = blueskyUrlInput.value.trim();
        if (blueskyUrl && !isValidSocialMediaUrl(blueskyUrl, 'bluesky')) {
            blueskyError.style.display = 'block';
            isValid = false;
        } else {
            blueskyError.style.display = 'none';
        }
        
        const tiktokUrl = tiktokUrlInput.value.trim();
        if (tiktokUrl && !isValidSocialMediaUrl(tiktokUrl, 'tiktok')) {
            tiktokError.style.display = 'block';
            isValid = false;
        } else {
            tiktokError.style.display = 'none';
        }
        
        const twitterUrl = twitterUrlInput.value.trim();
        if (twitterUrl && !isValidSocialMediaUrl(twitterUrl, 'twitter')) {
            twitterError.style.display = 'block';
            isValid = false;
        } else {
            twitterError.style.display = 'none';
        }
        
        const customButtonText = customButtonTextInput.value.trim();
        const customButtonUrl = customButtonUrlInput.value.trim();
        
        if ((customButtonText && !customButtonUrl) || (!customButtonText && customButtonUrl)) {
            customButtonError.textContent = 'Para criar um botão personalizado, ambos os campos (texto e URL) devem ser preenchidos.';
            customButtonError.style.display = 'block';
            isValid = false;
        } else if (customButtonUrl && !isValidUrl(customButtonUrl)) {
            customButtonError.textContent = 'Por favor, insira uma URL válida para o botão.';
            customButtonError.style.display = 'block';
            isValid = false;
        } else {
            customButtonError.style.display = 'none';
        }
        
        if (isValid) {
            tvData.socialMedia.facebook = facebookUrl;
            tvData.socialMedia.instagram = instagramUrl;
            tvData.socialMedia.bluesky = blueskyUrl;
            tvData.socialMedia.tiktok = tiktokUrl;
            tvData.socialMedia.twitter = twitterUrl;
            tvData.customButton.text = customButtonText;
            tvData.customButton.url = customButtonUrl;
            showScreen('screen6');
        }
    });
    
    enableCommercialsCheckbox.addEventListener('change', function() {
        tvData.enableCommercials = this.checked;
        toggleCommercialsVisibility();
    });
    
    customReleaseDateCheckbox.addEventListener('change', function() {
        tvData.customReleaseDate = this.checked;
        
        if (this.checked) {
            releaseDateContainer.style.display = 'block';
            
            const hoje = new Date();
            const ontem = new Date(hoje);
            ontem.setDate(hoje.getDate() - 1);
            const ontemFormatado = ontem.toISOString().split('T')[0];
            
            releaseDateInput.min = '2025-01-01';
            releaseDateInput.max = ontemFormatado;
            
            if (!releaseDateInput.value) {
                releaseDateInput.value = ontemFormatado;
                tvData.releaseDate = ontemFormatado;
            }
        } else {
            releaseDateContainer.style.display = 'none';
            tvData.releaseDate = '';
            releaseDateInput.value = '';
        }
    });
    
    commercialsPerBreakInput.addEventListener('input', function() {
        const value = parseInt(this.value);
        
        if (isNaN(value) || value < 1 || value > 8) {
            alert("O número de comerciais por intervalo deve ser entre 1 e 8.");
            this.value = Math.min(8, Math.max(1, value || 2));
        }
        
        tvData.commercialsPerBreak = parseInt(this.value) || 2;
    });
    
    addCommercialBtn.addEventListener('click', function() {
        const newCommercial = {
            name: `Comercial ${tvData.commercials.length + 1}`,
            url: ''
        };
        addCommercialCard(newCommercial, tvData.commercials.length);
        tvData.commercials.push(newCommercial);
        updateCommercials();
        validateAddCommercialButton();
        validateScreen4Navigation();
    });
    
    retryPublish.addEventListener('click', function() {
        resetScreen6();
        setTimeout(() => {
            iniciarPublicacao();
        }, 500);
    });
    
    updateAuthUI();
    showScreen('screen0');
});
</script>
