<script>
// ============================================================
// SCRIPT DO SMARTLINK (LIGHTBOX)
// Correção: Verifica se o DOM já está carregado antes de adicionar listener
// ============================================================
(function() {
    const smartlinkOverlay = document.getElementById('smartlinkOverlay');
    const unlockBtn = document.getElementById('unlockChannelBtn');
    const mainContent = document.getElementById('mainContent');
    
    function initSmartlink() {
        if (smartlinkOverlay && unlockBtn && mainContent && typeof smartlinkUrl !== 'undefined') {
            smartlinkOverlay.style.display = 'flex';
            mainContent.style.display = 'none';
            
            unlockBtn.addEventListener('click', function() {
                window.open(smartlinkUrl, '_blank');
                smartlinkOverlay.style.display = 'none';
                mainContent.style.display = 'block';
                if (typeof iniciarPlayer === 'function') {
                    setTimeout(() => iniciarPlayer(), 300);
                }
            });
        }
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSmartlink);
    } else {
        initSmartlink();
    }
})();

// ============================================================
// FUNÇÃO ATUALIZADA: Verificar disponibilidade do canal
// ============================================================
function verificarDisponibilidadeCanal(url, expectedVersion, isNewChannel, callback) {
    console.log(`Iniciando verificação. URL: ${url}, Versão esperada: ${expectedVersion}, É novo canal: ${isNewChannel}`);
    
    if (versionCheckInterval) {
        clearInterval(versionCheckInterval);
        versionCheckInterval = null;
    }
    
    const checkAvailability = async () => {
        try {
            const response = await fetch(url, {
                method: 'GET',
                cache: 'no-cache',
                headers: {
                    'Cache-Control': 'no-cache',
                    'Pragma': 'no-cache'
                }
            });
            
            if (response.status === 200) {
                const html = await response.text();
                
                if (isNewChannel) {
                    console.log(`✅ NOVO CANAL DISPONÍVEL! Status: ${response.status}`);
                    if (versionCheckInterval) {
                        clearInterval(versionCheckInterval);
                        versionCheckInterval = null;
                    }
                    callback(true, '1.0.0.0');
                    return;
                }
                
                const versionMatch = html.match(/Versão\s+([\d.]+)/);
                const publishedVersion = versionMatch ? versionMatch[1] : null;
                
                const metaVersionMatch = html.match(/<meta\s+name="version"\s+content="([\d.]+)"/);
                const metaVersion = metaVersionMatch ? metaVersionMatch[1] : null;
                
                const foundVersion = publishedVersion || metaVersion;
                console.log(`Versão encontrada no canal: ${foundVersion}, Versão esperada: ${expectedVersion}`);
                
                if (foundVersion === expectedVersion) {
                    console.log(`✅ ATUALIZAÇÃO CONFIRMADA! Versão ${foundVersion} disponível.`);
                    if (versionCheckInterval) {
                        clearInterval(versionCheckInterval);
                        versionCheckInterval = null;
                    }
                    callback(true, foundVersion);
                } else {
                    console.log(`⏳ Versão encontrada (${foundVersion}) não é a esperada (${expectedVersion}), continuando verificação...`);
                }
            } else if (response.status === 404 && !isNewChannel) {
                console.log(`📡 Canal não encontrado (404), mas esperado para atualização. Continuando...`);
            } else {
                console.log(`📡 Status inesperado: ${response.status}, continuando verificação...`);
            }
        } catch (error) {
            console.log(`❌ Erro na verificação (${error.message}), continuando verificação...`);
        }
    };
    
    checkAvailability();
    versionCheckInterval = setInterval(checkAvailability, 5000);
    
    return () => {
        if (versionCheckInterval) {
            clearInterval(versionCheckInterval);
            versionCheckInterval = null;
        }
    };
}

// ============================================================
// Função para publicar canal
// ============================================================
async function publicarCanal(nomeCanal, dadosGerador) {
    try {
        console.log("Iniciando publicação do canal:", nomeCanal);
        
        let channelIdParaVideos = currentChannelId;
        
        if (channelIdParaVideos && channelIdParaVideos.startsWith('temp-')) {
            channelIdParaVideos = nomeCanal.toLowerCase()
                .replace(/[^a-z0-9]/g, '-')
                .replace(/-+/g, '-');
            console.log("🔄 Convertendo ID temporário para:", channelIdParaVideos);
        }
        
        if (!channelIdParaVideos) {
            channelIdParaVideos = nomeCanal.toLowerCase()
                .replace(/[^a-z0-9]/g, '-')
                .replace(/-+/g, '-');
            console.log("📝 Criando novo channelId:", channelIdParaVideos);
        }
        
        const videosParaSalvar = dadosGerador.programmingMode === 'grade' 
            ? dadosGerador.programas 
            : dadosGerador.playlistVideos;
        
        console.log("📤 Enviando vídeos para proteção...");
        console.log("Channel ID:", channelIdParaVideos);
        console.log("Quantidade de vídeos:", videosParaSalvar.length);
        
        if (videosParaSalvar.length === 0) {
            console.warn("⚠️ Nenhum vídeo para salvar. Pulando proteção de vídeos.");
        } else {
            const saveVideosResponse = await fetch("https://us-central1-playtronic-tv.cloudfunctions.net/saveChannelVideos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    channelId: channelIdParaVideos,
                    videos: videosParaSalvar,
                    programmingMode: dadosGerador.programmingMode
                })
            });
            
            if (!saveVideosResponse.ok) {
                const errorText = await saveVideosResponse.text();
                console.error("❌ Erro ao salvar vídeos:", errorText);
                throw new Error(`Erro ao salvar vídeos: ${saveVideosResponse.status} - ${errorText}`);
            }
            
            const saveVideosResult = await saveVideosResponse.json();
            console.log("✅ Vídeos salvos no Firestore:", saveVideosResult);
        }
        
        const htmlCanal = gerarHTMLdoCanal(dadosGerador, channelIdParaVideos);
        
        const dadosEnvio = {
            nomeCanal: nomeCanal,
            htmlContent: htmlCanal,
            dadosConfig: dadosGerador,
            isNewChannel: !editingChannel,
            channelId: channelIdParaVideos
        };
        
        console.log("Enviando para o servidor...");
        const resposta = await fetch("https://cool-cloud-e4adtv.playtronicpublisher.workers.dev", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify(dadosEnvio)
        });
        
        if (!resposta.ok) {
            throw new Error(`Erro do servidor: ${resposta.status}`);
        }
        
        const resultado = await resposta.json();
        console.log("Resposta do servidor:", resultado);
        
        if (resultado.success) {
            const nomeArquivo = nomeCanal.toLowerCase()
                .replace(/[^a-z0-9]/g, '-')
                .replace(/-+/g, '-') + '.html';
            const urlCanal = `https://canaisdetv.online/canais/${nomeArquivo}`;
            
            return {
                url: urlCanal,
                message: resultado.message,
                nomeArquivo: nomeArquivo
            };
        } else {
            throw new Error(resultado.error || "Erro desconhecido do servidor");
        }
    } catch (error) {
        console.error("Erro na publicação:", error);
        throw error;
    }
}

// ============================================================
// Função para apagar canal do servidor

async function apagarCanalServidor(nomeCanal) {
    try {
        const nomeArquivo = nomeCanal.toLowerCase()
            .replace(/[^a-z0-9]/g, '-')
            .replace(/-+/g, '-') + '.html';
        
        const resposta = await fetch("https://cool-cloud-e4adtv.playtronicpublisher.workers.dev", {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ nomeArquivo: nomeArquivo })
        });
        
        const resultado = await resposta.json();
        return resultado.success;
    } catch (error) {
        console.error("Erro ao apagar canal do servidor:", error);
        return false;
    }
}

// ============================================================
// Carregar configurações de monetização do Firestore
// ============================================================
async function carregarConfiguracoesMonetizacao(channelId) {
    if (!currentUser || !channelId) {
        console.log("Usuário não autenticado ou channelId inválido");
        return null;
    }
    
    try {
        console.log(`Carregando configurações de monetização para o canal: ${channelId}`);
        
        const channelMonetizationRef = db.collection('channels').doc(channelId)
            .collection('monetization').doc('settings');
        const channelMonetizationDoc = await channelMonetizationRef.get();
        
        if (channelMonetizationDoc.exists) {
            const data = channelMonetizationDoc.data();
            console.log("Configurações de monetização encontradas na nova estrutura:", data);
            return data;
        }
        
        const userMonetizationRef = db.collection('users').doc(currentUser.uid)
            .collection('channels').doc(channelId)
            .collection('monetization').doc('settings');
        const userMonetizationDoc = await userMonetizationRef.get();
        
        if (userMonetizationDoc.exists) {
            const data = userMonetizationDoc.data();
            console.log("Configurações de monetização encontradas na estrutura antiga:", data);
            return data;
        }
        
        console.log("Nenhuma configuração de monetização encontrada para o canal:", channelId);
        return null;
        
    } catch (error) {
        console.error("Erro ao carregar configurações de monetização:", error);
        return null;
    }
}

// ============================================================
// Buscar canal por nome no banco de dados
// ============================================================
async function buscarCanalPorNome(nomeCanal, userId) {
    try {
        const querySnapshot = await db.collection('users').doc(userId)
            .collection('channels')
            .where('name', '==', nomeCanal)
            .limit(1)
            .get();
        
        if (!querySnapshot.empty) {
            const doc = querySnapshot.docs[0];
            return { id: doc.id, ...doc.data() };
        }
        return null;
    } catch (error) {
        console.error("Erro ao buscar canal por nome:", error);
        return null;
    }
}

// ============================================================
// Normalizar dados do canal
// ✅ Correção: Removida duplicação de propriedades
// ============================================================
function normalizarDadosCanal(channelData) {
    const dadosNormalizados = {
        email: channelData.email || '',
        name: channelData.name || '',
        slogan: channelData.slogan || '',
        logo: channelData.logo || DEFAULT_LOGO,
        visibility: channelData.visibility || 'brazil',
        showChannelNameWithLogo: channelData.showChannelNameWithLogo !== undefined ? channelData.showChannelNameWithLogo : true,
        showTime: channelData.showTime !== undefined ? channelData.showTime : true,
        enableRewind10: channelData.enableRewind10 !== undefined ? channelData.enableRewind10 : true,
        enableRestart: channelData.enableRestart !== undefined ? channelData.enableRestart : true,
        enableLive: channelData.enableLive !== undefined ? channelData.enableLive : true,
        enableDebug: channelData.enableDebug !== undefined ? channelData.enableDebug : true,
        customReleaseDate: channelData.customReleaseDate || false,
        releaseDate: channelData.releaseDate || '',
        programmingMode: channelData.programmingMode || 'grade',
        programs: Array.isArray(channelData.programs) ? channelData.programs : [],
        playlistVideos: Array.isArray(channelData.playlistVideos) ? channelData.playlistVideos : [],
        commercials: Array.isArray(channelData.commercials) ? channelData.commercials : [],
        enableCommercials: channelData.enableCommercials || false,
        commercialsPerBreak: channelData.commercialsPerBreak || 2,
        commercialsOrder: channelData.commercialsOrder || 'sequential',
        isOffline: channelData.isOffline || false,
        isAdultContent: channelData.isAdultContent || false,
        socialMedia: typeof channelData.socialMedia === 'object' ? {
            facebook: channelData.socialMedia.facebook || '',
            instagram: channelData.socialMedia.instagram || '',
            bluesky: channelData.socialMedia.bluesky || '',
            tiktok: channelData.socialMedia.tiktok || '',
            twitter: channelData.socialMedia.twitter || ''
        } : {
            facebook: '',
            instagram: '',
            bluesky: '',
            tiktok: '',
            twitter: ''
        },
        customButton: typeof channelData.customButton === 'object' ? {
            text: channelData.customButton.text || '',
            url: channelData.customButton.url || ''
        } : {
            text: '',
            url: ''
        },
        url: channelData.url || '',
        userId: channelData.userId || '',
        published: channelData.published || false,
        createdAt: channelData.createdAt || null,
        updatedAt: channelData.updatedAt || null,
        monetization: channelData.monetization || null,
        version: channelData.version || '1.0.0.0'
    };
    
    return dadosNormalizados;
}

// ============================================================
// Salvar canal no banco de dados
// ============================================================
async function salvarCanalBancoDados(channelData, isPublication = false) {
    if (!currentUser) {
        console.error("Usuário não autenticado para salvar canal");
        return null;
    }
    
    try {
        const userId = currentUser.uid;
        const now = firebase.firestore.FieldValue.serverTimestamp();
        const dadosNormalizados = normalizarDadosCanal(channelData);
        
        const isTemporaryId = currentChannelId && currentChannelId.startsWith('temp-');
        
        if (!editingChannel || originalChannelName !== dadosNormalizados.name || isTemporaryId) {
            const canalExistente = await buscarCanalPorNome(dadosNormalizados.name, userId);
            if (canalExistente) {
                throw new Error(`Já existe um canal com o nome "${dadosNormalizados.name}" para este usuário.`);
            }
        }
        
        if (isTemporaryId) {
            editingChannel = false;
        }
        
        const channelToSave = {
            ...dadosNormalizados,
            userId: userId,
            updatedAt: now,
            published: !!dadosNormalizados.url,
            monetization: dadosNormalizados.monetization || null
        };
        
        console.log("💾 Salvando canal no Firestore...");
        console.log("currentChannelId:", currentChannelId);
        console.log("isTemporaryId:", isTemporaryId);
        console.log("editingChannel:", editingChannel);
        
        if (isTemporaryId || !currentChannelId) {
            console.log("📝 Criando NOVO documento no Firestore");
            const docRef = await db.collection('users').doc(userId).collection('channels').add({
                ...channelToSave,
                createdAt: now
            });
            console.log("✅ Novo canal criado no Firestore:", docRef.id);
            currentChannelId = docRef.id;
            return docRef.id;
        }
        else if (currentChannelId && editingChannel) {
            console.log("✏️ Atualizando documento existente:", currentChannelId);
            await db.collection('users').doc(userId).collection('channels').doc(currentChannelId).update(channelToSave);
            console.log("✅ Canal atualizado no Firestore:", currentChannelId);
            return currentChannelId;
        }
        else {
            console.log("⚠️ Situação não prevista, criando novo documento");
            const docRef = await db.collection('users').doc(userId).collection('channels').add({
                ...channelToSave,
                createdAt: now
            });
            console.log("✅ Novo canal criado (fallback):", docRef.id);
            currentChannelId = docRef.id;
            return docRef.id;
        }
        
    } catch (error) {
        console.error("Erro ao salvar canal no banco de dados:", error);
        throw error;
    }
}

    }
    
    try {
        console.log("Carregando canais do banco de dados para usuário:", currentUser.uid);
        
        const querySnapshot = await db.collection('users').doc(currentUser.uid)
            .collection('channels')
            .orderBy('updatedAt', 'desc')
            .get();
        
        const channels = [];
        querySnapshot.forEach(doc => {
            const data = doc.data();
            const canalNormalizado = normalizarDadosCanal(data);
            console.log(`📊 ${canalNormalizado.name}:`, {
                temMonetizacao: !!canalNormalizado.monetization,
                dadosMonetizacao: canalNormalizado.monetization
            });
            channels.push({ id: doc.id, ...canalNormalizado });
        });
        
        console.log(`${channels.length} canais carregados do banco de dados (normalizados)`);
        return channels;
        
    } catch (error) {
        console.error("Erro ao carregar canais do banco de dados:", error);
        return [];
    }
}

// ============================================================
// Função principal de publicação
// ============================================================
async function iniciarPublicacao() {
    console.log("Iniciando publicação...");
    
    if (!currentUser) {
        console.log("Usuário não autenticado, mostrando mensagem de autenticação");
        mostrarMensagemAutenticacao();
        return;
    }
    
    publicationStarted = true;
    
    if (!currentChannelId && !editingChannel) {
        const nomeNormalizado = tvData.name.toLowerCase()
            .replace(/[^a-z0-9]/g, '-')
            .replace(/-+/g, '-');
        currentChannelId = `temp-${Date.now()}-${nomeNormalizado}`;
        console.log("📝 Criando channelId temporário para novo canal:", currentChannelId);
    }
    
    if (editingChannel) {
        tvData.version = incrementarVersao(tvData.version);
        console.log(`Versão incrementada para atualização: ${tvData.version}`);
    } else {
        tvData.version = '1.0.0.0';
        console.log(`Novo canal com versão: ${tvData.version}`);
    }
    
    const dadosNormalizados = normalizarDadosCanal(tvData);
    
    if (editingChannel && currentChannelId) {
        const monetizationData = await carregarConfiguracoesMonetizacao(currentChannelId);
        if (monetizationData) {
            dadosNormalizados.monetization = monetizationData;
        }
    }
    
    if (!dadosNormalizados.monetization) {
        dadosNormalizados.monetization = {
            adsTerraBanner: { enabled: false, code: '' },
            adsTerraInterstitial: { enabled: false, code: '' },
            pixDonations: { enabled: false, mpAccessToken: '', mpPlatformUserId: '282224393' },
            paidCommercials: { enabled: false, pricePerSecond: 0.05, maxDuration: 90, mpAccessToken: '', mpPlatformUserId: '282224393' }
        };
    }
    
    let GRADE = [];
    if (dadosNormalizados.programmingMode === 'grade') {
        const totalPrograms = dadosNormalizados.programs.length;
        if (totalPrograms === 0) {
            for (let i = 0; i < totalSlots; i++) {
                GRADE.push(0);
            }
        } else {
            for (let i = 0; i < totalSlots; i++) {
                GRADE.push(i % totalPrograms);
            }
        }
    }

// ============================================================
// Carregar todos os canais
// ✅ Correção: Removida redundância na verificação de monetização
// ============================================================
async function carregarCanais() {
    try {
        console.log("🔄 Carregando canais do banco de dados...");
        
        const channelsList = document.getElementById('channelsList');
        const emptyState = document.getElementById('emptyState');
        channels = [];
        
        if (channelsList) channelsList.innerHTML = '';
        
        for (let channelId in channelViewerListeners) {
            if (channelViewerListeners[channelId]) {
                channelViewerListeners[channelId].ref.off('value', channelViewerListeners[channelId].listener);
            }
        }
        channelViewerListeners = {};
        
        const canaisBancoDados = await carregarCanaisBancoDados();
        console.log(`${canaisBancoDados.length} canais carregados do banco de dados`);
        channels = canaisBancoDados;
        
        if (channels.length === 0) {
            if (emptyState) emptyState.style.display = 'block';
            if (channelsList) channelsList.style.display = 'none';
        } else {
            if (emptyState) emptyState.style.display = 'none';
            if (channelsList) {
                channelsList.style.display = 'grid';
                
                channels.forEach(channel => {
                    const channelCard = document.createElement('div');
                    channelCard.className = 'channel-card';
                    channelCard.setAttribute('data-channel', channel.id);
                    
                    const nomeArquivo = channel.name.toLowerCase()
                        .replace(/[^a-z0-9]/g, '-')
                        .replace(/-+/g, '-') + '.html';
                    const urlCanal = channel.url || `https://canaisdetv.online/canais/${nomeArquivo}`;
                    const isOffline = channel.isOffline || false;
                    const visibility = channel.visibility || 'brazil';
                    const isPublished = channel.published || false;
                    const isAdultContent = channel.isAdultContent || false;
                    
                    let visibilityIcon = '';
                    if (visibility === 'brazil') {
                        visibilityIcon = `<img src="${BRAZIL_FLAG}" class="visibility-icon" title="Seu canal está visível somente no Brasil" style="width: 25px; height: 25px;">`;
                    } else {
                        visibilityIcon = `<img src="${WORLD_ICON}" class="visibility-icon" title="Seu canal está visível no mundo todo" style="width: 25px; height: 25px;">`;
                    }
                    
                    let adultIcon = '';
                    if (isAdultContent) {
                        adultIcon = `<img src="${ADULT_ICON}" class="adult-content-icon" title="Este canal transmite conteúdo adulto (18+)" style="width: 25px; height: 25px;">`;
                    }
                    
                    let statusText = '';
                    let statusClass = '';
                    if (isOffline) {
                        statusText = 'Fora do ar';
                        statusClass = 'status-offline';
                    } else if (!isPublished) {
                        statusText = 'Não publicado';
                        statusClass = 'status-unpublished';
                    } else {
                        statusText = 'Publicado';
                        statusClass = 'status-published';
                    }
                    
                    const channelIdForFirebase = channel.id;
                    
                    console.log('🔥 DEBUG - CANAL:', channel.name);
                    console.log('🔥 ID Firestore:', channel.id);
                    console.log('🔥 URL do canal:', channel.url);
                    console.log('---');
                    
                    channelCard.innerHTML = `
                        ${channel.logo && channel.logo !== DEFAULT_LOGO 
                            ? `<img src="${channel.logo}" class="channel-logo-small" alt="Logo">` 
                            : `<img src="${DEFAULT_LOGO}" class="channel-logo-small" alt="Logo Padrão">`}
                        <div class="channel-name-with-emoji">
                            <h3>${channel.name}</h3>
                        </div>
                        ${visibilityIcon}
                        ${adultIcon}
                        <p class="spectators" id="spectators-${channel.id}">
                            <span style="display:inline-block; width:8px; height:8px; background:#ff4444; border-radius:50%; margin-right:5px; animation:pulse 1.5s infinite;"></span>
                            <span class="spectator-count">0</span> espectadores online
                        </p>
                        <div class="channel-status ${statusClass}">${statusText}</div>
                        <div class="channel-actions">
                            ${urlCanal && urlCanal !== 'https://canaisdetv.online/canais/.html' 
                                ? `<button class="watch-channel" data-id="${channel.id}" data-url="${urlCanal}">Abrir ${channel.name}</button>` 
                                : ''}
                            <button class="edit-channel" data-id="${channel.id}">Editar</button>
                            <button class="monetize-channel" data-id="${channel.id}">Monetizar</button>
                            <button class="toggle-offline-channel" data-id="${channel.id}" data-offline="${isOffline}">
                                ${isOffline ? 'Reativar Canal' : 'Tirar do Ar'}
                            </button>
                            <button class="delete-channel delete-button" data-id="${channel.id}">Apagar</button>
                        </div>
                    `;
                    
                    channelsList.appendChild(channelCard);
                    
                    // Verificação única de monetização
                    if (channel.id) {
                        setTimeout(async () => {
                            try {
                                const hasMonetization = await hasActiveMonetization(channel.id);
                                console.log(`🔍 ${channel.name} - Monetização ativa: ${hasMonetization}`);
                                
                                const card = document.querySelector(`[data-channel="${channel.id}"]`);
                                if (!card) return;
                                
                                const existingIcon = card.querySelector('.monetization-icon');
                                if (existingIcon) existingIcon.remove();
                                
                                if (hasMonetization) {
                                    console.log(`✅ ${channel.name} - ADICIONANDO ícone de monetização`);
                                    const leftPos = isAdultContent ? 80 : 45;
                                    
                                    const iconHTML = `<img src="https://raw.githubusercontent.com/Playtronic/tv/refs/heads/main/template/real.png" class="monetization-icon" title="Canal monetizado" style="width: 25px; height: 25px; left: ${leftPos}px;">`;
                                    card.insertAdjacentHTML('beforeend', iconHTML);
                                }
                            } catch (error) {
                                console.error(`Erro ao verificar monetização para ${channel.name}:`, error);
                            }
                        }, 50);
                    }
                    
                    // Monitorar espectadores online
                    if (!isOffline && isPublished) {
                        console.log('🔥 Monitorando: onlineUsers/' + channelIdForFirebase);
                        
                        const onlineViewersRef = rtdb.ref('onlineUsers/' + channelIdForFirebase);
                        const listener = onlineViewersRef.on('value', (snapshot) => {
                            const spectatorsElement = document.getElementById(`spectators-${channelIdForFirebase}`);
                            if (!spectatorsElement) {
                                console.log('❌ Elemento não encontrado: spectators-' + channelIdForFirebase);
                                return;
                            }
                            
                            if (!snapshot.exists()) {
                                const countElement = spectatorsElement.querySelector('.spectator-count');
                                if (countElement) countElement.textContent = '0';
                                return;
                            }
                            
                            const viewers = snapshot.val();
                            const totalCount = Object.keys(viewers).length;
                            
                            const countElement = spectatorsElement.querySelector('.spectator-count');
                            if (countElement) countElement.textContent = totalCount;
                        });
                        
                        channelViewerListeners[channelIdForFirebase] = {
                            ref: onlineViewersRef,
                            listener: listener
                        };
                    }
                    
                    // Event listeners
                    const watchBtn = channelCard.querySelector('.watch-channel');
                    const editBtn = channelCard.querySelector('.edit-channel');
                    const toggleBtn = channelCard.querySelector('.toggle-offline-channel');
                    const deleteBtn = channelCard.querySelector('.delete-channel');
                    const monetizeBtn = channelCard.querySelector('.monetize-channel');
                    
                    if (monetizeBtn) {
                        monetizeBtn.addEventListener('click', function() {
                            const channelId = this.getAttribute('data-id');
                            window.location.href = `monetizar.html?channelId=${channelId}`;
                        });
                    }
                    
                    if (watchBtn) {
                        watchBtn.addEventListener('click', function() {
                            const channelUrl = this.getAttribute('data-url');
                            window.open(channelUrl, '_blank');
                        });
                    }
                    
                    if (editBtn) {
                        editBtn.addEventListener('click', function() {
                            const channelId = this.getAttribute('data-id');
                            editChannel(channelId);
                        });
                    }
                    
                    if (toggleBtn) {
                        toggleBtn.addEventListener('click', function() {
                            const channelId = this.getAttribute('data-id');
                            const isOffline = this.getAttribute('data-offline') === 'true';
                            toggleChannelOffline(channelId, isOffline);
                        });
                    }
                    
                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', function() {
                            const channelId = this.getAttribute('data-id');
                            deleteChannel(channelId);
                        });
                    }
                });
            }
        }
        
        console.log(`Total de ${channels.length} canais exibidos`);
        
    } catch (error) {
        console.error("Erro ao carregar canais:", error);
        const emptyState = document.getElementById('emptyState');
        const channelsList = document.getElementById('channelsList');
        if (emptyState) emptyState.style.display = 'block';
        if (channelsList) channelsList.style.display = 'none';
    }
}

// ============================================================
// Alternar estado "fora do ar" do canal
// ✅ Correção: Sintaxe ajustada
// ============================================================
async function toggleChannelOffline(channelId, isCurrentlyOffline) {
    if (!currentUser) {
        alert("É necessário fazer login para modificar canais");
        return;
    }
    
    try {
        const doc = await db.collection('users').doc(currentUser.uid).collection('channels').doc(channelId).get();
        
        if (!doc.exists) {
            alert("Canal não encontrado");
            return;
        }
        
        const channel = doc.data();
        const dadosNormalizados = normalizarDadosCanal(channel);
        const novoEstadoOffline = !isCurrentlyOffline;
        
        tvData = { ...dadosNormalizados };
        
        const monetizationData = await carregarConfiguracoesMonetizacao(channelId);
        if (monetizationData) {
            tvData.monetization = monetizationData;
            console.log("Configurações de monetização carregadas:", monetizationData);
        } else {
            tvData.monetization = null;
        }
        
        tvData.isOffline = novoEstadoOffline;
        currentChannelId = channelId;
        editingChannel = true;
        originalChannelName = dadosNormalizados.name;
        
        showScreen('screen6');
        
    } catch (error) {
        console.error("Erro ao alternar estado do canal:", error);
        alert("Erro ao modificar canal. Tente novamente.");
    }
}

function addProgramCard(program, index) {
    const programId = program.id || `program-${Date.now()}-${index}`;
    const programCard = document.createElement('div');
    programCard.className = 'program-card';
    programCard.id = programId;
    
    programCard.innerHTML = `
        <div class="program-header">
            <div class="program-title">
                <button class="expand-btn" data-program="${programId}">▶</button>
                <h3>Programa ${index + 1}${program.name ? `: ${program.name}` : ''}</h3>
            </div>
            <button type="button" class="remove-program delete-button" data-program="${programId}">Remover</button>
        </div>
        <div class="program-body" style="display: none;">
            <div class="form-group">
                <label for="${programId}-name">Nome do Programa (máx. 50 caracteres):</label>
                <input type="text" id="${programId}-name" maxlength="50" value="${program.name || ''}" placeholder="Ex: Sessão Anime" required>
                <div class="char-counter" id="${programId}-name-counter">${program.name ? program.name.length : 0}/50</div>
                <div class="error-message" id="${programId}-name-error" style="display: none;">O nome do programa é obrigatório.</div>
            </div>
            <div class="form-group">
                <label>Episódios (Dias):</label>
                <ul class="video-list" id="${programId}-videos"></ul>
                <div class="add-video-form">
                    <input type="url" id="${programId}-new-video" placeholder="URL do vídeo (ex: https://exemplo.com/video.mp4 ou YouTube)">
                    <button type="button" class="add-episode-btn" data-program="${programId}">Adicionar Episódio</button>
                </div>
                <div class="error-message" id="${programId}-videos-error" style="display: none;">Pelo menos um vídeo é obrigatório para cada programa.</div>
            </div>
        </div>
    `;
    
    const programsContainer = document.getElementById('programsContainer');
    programsContainer.appendChild(programCard);
    
    const videoList = document.getElementById(`${programId}-videos`);
    if (program.videos && program.videos.length > 0) {
        program.videos.forEach((videoUrl, videoIndex) => {
            const videoItem = document.createElement('li');
            videoItem.innerHTML = `
                <span>Vídeo - Dia ${videoIndex + 1}: ${videoUrl}</span>
                <button type="button" class="remove-video">Remover</button>
            `;
            videoList.appendChild(videoItem);
        });
    }
    
    const expandBtn = programCard.querySelector('.expand-btn');
    const programBody = programCard.querySelector('.program-body');
    const nameInput = document.getElementById(`${programId}-name`);
    const nameCounter = document.getElementById(`${programId}-name-counter`);
    const nameError = document.getElementById(`${programId}-name-error`);
    const videosError = document.getElementById(`${programId}-videos-error`);
    const removeProgramBtn = programCard.querySelector('.remove-program');
    const addEpisodeBtn = programCard.querySelector('.add-episode-btn');
    const newVideoInput = document.getElementById(`${programId}-new-video`);
    
    expandBtn.addEventListener('click', function() {
        const isCollapsed = programBody.style.display === 'none';
        programBody.style.display = isCollapsed ? 'block' : 'none';
        expandBtn.textContent = isCollapsed ? '▼' : '▶';
        
        if (isCollapsed && nameInput.value) {
            const programTitle = programCard.querySelector('.program-title h3');
            programTitle.textContent = `Programa ${getProgramIndex(programId) + 1}: ${nameInput.value}`;
        }
    });
    
    nameInput.addEventListener('input', function() {
        nameCounter.textContent = `${this.value.length}/50`;
        
        if (this.value.length > 45) {
            nameCounter.className = 'char-counter near-limit';
        } else if (this.value.length > 50) {
            nameCounter.className = 'char-counter over-limit';
        } else {
            nameCounter.className = 'char-counter';
        }
        
        if (this.value.trim() === '') {
            nameError.style.display = 'block';
        } else {
            nameError.style.display = 'none';
        }
        
        const programTitle = programCard.querySelector('.program-title h3');
        const programIndex = getProgramIndex(programId);
        programTitle.textContent = `Programa ${programIndex + 1}: ${this.value}`;
        
        updatePrograms();
        validateAddProgramButton();
        validateScreen3Navigation();
    });
    
    removeProgramBtn.addEventListener('click', function() {
        if (confirm('Tem certeza que deseja remover este programa?')) {
            programCard.remove();
            reindexPrograms();
            updatePrograms();
            validateAddProgramButton();
            validateScreen3Navigation();
        }
    });
    
    addEpisodeBtn.addEventListener('click', function() {
        const videoUrl = newVideoInput.value.trim();
        
        if (!videoUrl) {
            alert('Por favor, insira uma URL para o vídeo.');
            return;
        }
        
        if (!isValidUrl(videoUrl)) {
            alert('Por favor, insira uma URL válida para o vídeo.');
            return;
        }
        
        const videoList = document.getElementById(`${programId}-videos`);
        const videoItem = document.createElement('li');
        const dayNumber = videoList.children.length + 1;
        
        videoItem.innerHTML = `
            <span>Vídeo - Dia ${dayNumber}: ${videoUrl}</span>
            <button type="button" class="remove-video">Remover</button>
        `;
        
        videoList.appendChild(videoItem);
        newVideoInput.value = '';
        
        if (videosError) videosError.style.display = 'none';
        
        if (programBody.style.display === 'none') {
            programBody.style.display = 'block';
            expandBtn.textContent = '▼';
        }
        
        updatePrograms();
        validateAddProgramButton();
        validateScreen3Navigation();
    });
    
    videoList.addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-video')) {
            e.target.parentElement.remove();
            
            const items = videoList.querySelectorAll('li');
            items.forEach((item, index) => {
                const span = item.querySelector('span');
                span.textContent = span.textContent.replace(/Vídeo - Dia \d+:/, `Vídeo - Dia ${index + 1}:`);
            });
            
            if (videoList.children.length === 0 && videosError) {
                videosError.style.display = 'block';
            }
            
            updatePrograms();
            validateAddProgramButton();
            validateScreen3Navigation();
        }
    });
    
    newVideoInput.addEventListener('input', function() {
        addEpisodeBtn.disabled = !this.value.trim() || !isValidUrl(this.value.trim());
    });
    
    addEpisodeBtn.disabled = true;
    
    if (videoList.children.length === 0 && videosError) {
        videosError.style.display = 'block';
    }
    
    if (nameInput.value.trim() === '' && nameError) {
        nameError.style.display = 'block';
    }
}

        } else if (this.value.length > 50) {
            nameCounter.className = 'char-counter over-limit';
        } else {
            nameCounter.className = 'char-counter';
        }
        
        if (this.value.trim() === '') {
            nameError.style.display = 'block';
        } else {
            nameError.style.display = 'none';
        }
        
        const videoTitle = videoCard.querySelector('h4');
        videoTitle.textContent = `Vídeo ${getPlaylistVideoIndex(videoId) + 1}: ${this.value}`;
        
        updatePlaylistVideos();
        validateAddPlaylistVideoButton();
        validateScreen3Navigation();
    });
    
    urlInput.addEventListener('input', function() {
        if (this.value.trim() === '') {
            urlError.style.display = 'block';
        } else if (!isValidUrl(this.value.trim())) {
            urlError.textContent = 'Por favor, insira uma URL válida para o vídeo.';
            urlError.style.display = 'block';
        } else {
            urlError.style.display = 'none';
        }
        
        updatePlaylistVideos();
        validateAddPlaylistVideoButton();
        validateScreen3Navigation();
    });
    
    removeVideoBtn.addEventListener('click', function() {
        if (confirm('Tem certeza que deseja remover este vídeo?')) {
            videoCard.remove();
            reindexPlaylistVideos();
            updatePlaylistVideos();
            validateAddPlaylistVideoButton();
            validateScreen3Navigation();
        }
    });
    
    if (nameInput.value.trim() === '' && nameError) {
        nameError.style.display = 'block';
    }
    
    if (urlInput.value.trim() === '' && urlError) {
        urlError.style.display = 'block';
    }
}

function getProgramIndex(programId) {
    const programCards = document.querySelectorAll('.program-card');
    for (let i = 0; i < programCards.length; i++) {
        if (programCards[i].id === programId) {
            return i;
        }
    }
    return -1;
}

function getPlaylistVideoIndex(videoId) {
    const videoCards = document.querySelectorAll('.playlist-video-card');
    for (let i = 0; i < videoCards.length; i++) {
        if (videoCards[i].id === videoId) {
            return i;
        }
    }
    return -1;
}

function reindexPrograms() {

function reindexPlaylistVideos() {

function validateAddProgramButton() {
    const addProgramBtn = document.getElementById('addProgram');
    
    if (tvData.programmingMode !== 'grade') {
        addProgramBtn.style.display = 'none';
        return;
    }
    
    addProgramBtn.style.display = 'block';
    
    if (tvData.programs.length >= totalSlots) {
        addProgramBtn.disabled = true;
        addProgramBtn.textContent = "Limite de 58 programas atingido";
        return;
    }
    
    if (tvData.programs.length === 0) {
        addProgramBtn.disabled = false;
        addProgramBtn.textContent = "+ Adicionar Novo Programa";
        return;
    }
    
    const lastProgram = tvData.programs[tvData.programs.length - 1];
    const hasName = lastProgram && lastProgram.name && lastProgram.name.trim().length > 0;
    const hasVideos = lastProgram && lastProgram.videos && lastProgram.videos.length > 0;
    
    addProgramBtn.disabled = !(hasName && hasVideos);
    addProgramBtn.textContent = "+ Adicionar Novo Programa";
}

function validateAddPlaylistVideoButton() {
    const addPlaylistVideoBtn = document.getElementById('addPlaylistVideo');
    
    if (tvData.programmingMode !== 'playlist') {
        addPlaylistVideoBtn.style.display = 'none';
        return;
    }
    
    addPlaylistVideoBtn.style.display = 'block';
    
    if (tvData.playlistVideos.length === 0) {
        addPlaylistVideoBtn.disabled = false;
        addPlaylistVideoBtn.textContent = "+ Adicionar Novo Vídeo";
        return;
    }
    
    const lastVideo = tvData.playlistVideos[tvData.playlistVideos.length - 1];
    const hasName = lastVideo && lastVideo.name && lastVideo.name.trim().length > 0;
    const hasUrl = lastVideo && lastVideo.url && lastVideo.url.trim().length > 0 && isValidUrl(lastVideo.url.trim());
    
    addPlaylistVideoBtn.disabled = !(hasName && hasUrl);
    addPlaylistVideoBtn.textContent = "+ Adicionar Novo Vídeo";
}

function updatePrograms() {
    tvData.programs = [];
    const programElements = document.querySelectorAll('.program-card');
    
    programElements.forEach(programElement => {
        const programId = programElement.id;
        const nameInput = document.getElementById(`${programId}-name`);
        const name = nameInput ? nameInput.value : '';
        const videoList = document.getElementById(`${programId}-videos`);
        const videos = [];
        
        if (videoList) {
            videoList.querySelectorAll('li').forEach(li => {
                const span = li.querySelector('span');
                const videoUrl = span.textContent.replace(/Vídeo - Dia \d+:\s*/, '');
                videos.push(videoUrl);
            });
        }
        
        tvData.programs.push({
            id: programId,
            name: name,
            videos: videos
        });
    });
    
    updateCounters();
}

function updatePlaylistVideos() {
    tvData.playlistVideos = [];
    const videoElements = document.querySelectorAll('.playlist-video-card');
    
    videoElements.forEach(videoElement => {
        const videoId = videoElement.id;
        const nameInput = document.getElementById(`${videoId}-name`);
        const name = nameInput ? nameInput.value : '';
        const urlInput = document.getElementById(`${videoId}-url`);
        const url = urlInput ? urlInput.value : '';
        
        tvData.playlistVideos.push({
            id: videoId,
            name: name,
            url: url
        });
    });
    
    updateCounters();
}

function updateCounters() {
    if (tvData.programmingMode === 'grade') {
        const programCount = document.getElementById('programCount');
        programCount.textContent = tvData.programs.length;
        validateAddProgramButton();
    } else {
        const playlistCount = document.getElementById('playlistCount');
        playlistCount.textContent = tvData.playlistVideos.length;
        validateAddPlaylistVideoButton();
    }
}

function validateScreen3Navigation() {
    const toScreen4Btn = document.getElementById('toScreen4');
    const programsError = document.getElementById('programsError');
    const playlistError = document.getElementById('playlistError');
    
    programsError.style.display = 'none';
    playlistError.style.display = 'none';
    
    if (tvData.programmingMode === 'grade') {
        if (tvData.programs.length === 0) {
            toScreen4Btn.disabled = true;
            programsError.textContent = '⚠️ Atenção: É necessário adicionar pelo menos um programa.';
            programsError.style.display = 'block';
            return false;
        }
        
        let hasErrors = false;
        let errorMessages = [];
        
        tvData.programs.forEach((program, index) => {
            if (!program.name || program.name.trim() === '') {
                hasErrors = true;
                errorMessages.push(`Programa ${index + 1} está sem nome.`);
                const programId = program.id;
                const nameError = document.getElementById(`${programId}-name-error`);
                if (nameError) nameError.style.display = 'block';
            }
            
            if (!program.videos || program.videos.length === 0) {
                hasErrors = true;
                errorMessages.push(`Programa "${program.name || index + 1}" não tem vídeos.`);
                const programId = program.id;
                const videosError = document.getElementById(`${programId}-videos-error`);
                if (videosError) videosError.style.display = 'block';
            }
        });
        
        if (hasErrors) {
            toScreen4Btn.disabled = true;
            programsError.textContent = `⚠️ Atenção: ${errorMessages.join(' ')}`;
            programsError.style.display = 'block';
            return false;
        } else {
            toScreen4Btn.disabled = false;
            programsError.style.display = 'none';
            return true;
        }
    } else {
        if (tvData.playlistVideos.length === 0) {
            toScreen4Btn.disabled = true;
            playlistError.textContent = '⚠️ Atenção: É necessário adicionar pelo menos um vídeo.';
            playlistError.style.display = 'block';
            return false;
        }
        
        let hasErrors = false;
        let errorMessages = [];
        
        tvData.playlistVideos.forEach((video, index) => {
            if (!video.name || video.name.trim() === '') {
                hasErrors = true;
                errorMessages.push(`Vídeo ${index + 1} está sem nome.`);
                const videoId = video.id;
                const nameError = document.getElementById(`${videoId}-name-error`);
                if (nameError) nameError.style.display = 'block';
            }
            
            if (!video.url || video.url.trim() === '' || !isValidUrl(video.url.trim())) {
                hasErrors = true;
                errorMessages.push(`Vídeo "${video.name || index + 1}" não tem uma URL válida.`);
                const videoId = video.id;
                const urlError = document.getElementById(`${videoId}-url-error`);
                if (urlError) urlError.style.display = 'block';
            }
        });
        
        if (hasErrors) {
            toScreen4Btn.disabled = true;
            playlistError.textContent = `⚠️ Atenção: ${errorMessages.join(' ')}`;
            playlistError.style.display = 'block';
            return false;
        } else {
            toScreen4Btn.disabled = false;
            playlistError.style.display = 'none';
            return true;
        }
    }
}

function alternarModoProgramacao() {
    const programmingModeSelect = document.getElementById('programmingMode');
    const gradeModeContainer = document.getElementById('gradeModeContainer');
    const playlistModeContainer = document.getElementById('playlistModeContainer');
    const programmingModeInfo = document.getElementById('programmingModeInfo');
    const selectedMode = programmingModeSelect.value;

}

function addCommercialCard(commercial, index) {
    const commercialId = 'commercial-' + Date.now() + '-' + index;
    const commercialCard = document.createElement('div');
    commercialCard.className = 'commercial-card';
    commercialCard.id = commercialId;
    
    const commercialObj = typeof commercial === 'string' 
        ? { name: `Comercial ${index + 1}`, url: commercial } 
        : commercial;
    
    const commercialNumber = index + 1;
    
    commercialCard.innerHTML = `
        <div class="commercial-header">
            <h4>Comercial ${commercialNumber}</h4>
            <button type="button" class="remove-commercial delete-button" data-commercial="${commercialId}">Remover</button>
        </div>
        <div class="form-group">
            <label for="${commercialId}-name">Nome (controle interno, máx. 50 caracteres):</label>
            <input type="text" id="${commercialId}-name" value="${commercialObj.name || ''}" placeholder="Ex: Comercial da Empresa X" maxlength="50">
            <div class="char-counter" id="${commercialId}-name-counter">${commercialObj.name ? commercialObj.name.length : 0}/50</div>
        </div>
        <div class="form-group">
            <label for="${commercialId}-url">URL do comercial:</label>
            <input type="url" id="${commercialId}-url" value="${commercialObj.url || ''}" placeholder="URL do comercial" required>
            <div class="error-message" id="${commercialId}-url-error" style="display: none;">URL do comercial é obrigatória.</div>
        </div>
    `;
    
    const commercialsContainer = document.getElementById('commercialsContainer');
    commercialsContainer.appendChild(commercialCard);
    
    const nameInput = document.getElementById(`${commercialId}-name`);
    const nameCounter = document.getElementById(`${commercialId}-name-counter`);
    const urlInput = document.getElementById(`${commercialId}-url`);
    const urlError = document.getElementById(`${commercialId}-url-error`);
    
    nameInput.addEventListener('input', function() {
        nameCounter.textContent = `${this.value.length}/50`;
        
        if (this.value.length > 45) {
            nameCounter.className = 'char-counter near-limit';
        } else if (this.value.length > 50) {
            nameCounter.className = 'char-counter over-limit';
        } else {
            nameCounter.className = 'char-counter';
        }
        
        updateCommercials();
        validateScreen4Navigation();
        validateAddCommercialButton();
    });
    
    urlInput.addEventListener('input', function() {
        if (this.value.trim() === '') {
            urlError.style.display = 'block';
        } else if (!isValidUrl(this.value.trim())) {
            urlError.textContent = 'URL do comercial é inválida.';
            urlError.style.display = 'block';
        } else {
            urlError.style.display = 'none';
        }
        
        updateCommercials();
        validateScreen4Navigation();
        validateAddCommercialButton();
    });
    
    document.querySelector(`#${commercialId} .remove-commercial`).addEventListener('click', function() {
        const commercialId = this.getAttribute('data-commercial');
        document.getElementById(commercialId).remove();
        updateCommercials();
        reindexCommercials();
        validateScreen4Navigation();
        validateAddCommercialButton();
    });
    
    if (urlInput.value.trim() === '' && urlError) {
        urlError.style.display = 'block';
    }
}

function reindexCommercials() {
    const commercialElements = document.querySelectorAll('.commercial-card');
    commercialElements.forEach((commercialElement, index) => {
        const commercialId = commercialElement.id;
        const commercialHeader = commercialElement.querySelector('.commercial-header h4');
        const commercialNumber = index + 1;
        commercialHeader.textContent = `Comercial ${commercialNumber}`;
        
        const nameInput = document.getElementById(`${commercialId}-name`);
        if (nameInput && !nameInput.value.trim()) {
            nameInput.value = `Comercial ${commercialNumber}`;
        }
    });
    
    updateCommercials();
}

function updateCommercials() {
    tvData.commercials = [];
    const commercialElements = document.querySelectorAll('.commercial-card');
    
    commercialElements.forEach(commercialElement => {
        const commercialId = commercialElement.id;
        const name = document.getElementById(`${commercialId}-name`).value;
        const url = document.getElementById(`${commercialId}-url`).value;
        
        if (url) {
            tvData.commercials.push({
                name: name || `Comercial ${tvData.commercials.length + 1}`,
                url: url
            });
        } else {
            tvData.commercials.push({
                name: name || `Comercial ${tvData.commercials.length + 1}`,
                url: ''
            });
        }
    });
}

function validateAddCommercialButton() {
    const addCommercialBtn = document.getElementById('addCommercial');
    
    if (!tvData.enableCommercials) {
        addCommercialBtn.style.display = 'none';
        return;
    }
    
    addCommercialBtn.style.display = 'block';
    
    if (tvData.commercials.length === 0) {
        addCommercialBtn.disabled = false;
        addCommercialBtn.textContent = "+ Adicionar Novo Comercial";
        return;
    }
    
    let hasInvalidCommercial = false;
    for (let i = 0; i < tvData.commercials.length; i++) {
        const commercial = tvData.commercials[i];
        if (!commercial.url || commercial.url.trim() === '' || !isValidUrl(commercial.url.trim())) {
            hasInvalidCommercial = true;
            break;
        }
    }
    
    addCommercialBtn.disabled = hasInvalidCommercial;
    addCommercialBtn.textContent = "+ Adicionar Novo Comercial";

function validateScreen4Navigation() {
    const toScreen5Btn = document.getElementById('toScreen5');
    
    if (!tvData.enableCommercials) {
        toScreen5Btn.disabled = false;
        return true;
    }
    
    if (tvData.commercials.length === 0) {
        toScreen5Btn.disabled = true;
        return false;
    }
    
    let hasErrors = false;
    for (let i = 0; i < tvData.commercials.length; i++) {
        const commercial = tvData.commercials[i];
        if (!commercial.url || commercial.url.trim() === '' || !isValidUrl(commercial.url.trim())) {
            hasErrors = true;
            break;
        }
    }
    
    toScreen5Btn.disabled = hasErrors;
    return !hasErrors;
}

function validateCommercialsPerBreak() {
    const commercialsPerBreakInput = document.getElementById('commercialsPerBreak');
    const value = parseInt(commercialsPerBreakInput.value);
    
    if (isNaN(value) || value < 1 || value > 8) {
        alert("O número de comerciais por intervalo deve ser entre 1 e 8.");
        commercialsPerBreakInput.value = Math.min(8, Math.max(1, value || 2));
        tvData.commercialsPerBreak = parseInt(commercialsPerBreakInput.value);
        return false;
    }
    
    tvData.commercialsPerBreak = value;
    return true;
}

function toggleCommercialsVisibility() {
    const enableCommercialsCheckbox = document.getElementById('enableCommercials');
    const commercialSettings = document.getElementById('commercialSettings');
    const commercialsContainer = document.getElementById('commercialsContainer');
    const addCommercialBtn = document.getElementById('addCommercial');
    
    if (enableCommercialsCheckbox.checked) {
        commercialSettings.style.display = 'block';

        addCommercialBtn.style.display = 'block';
        validateAddCommercialButton();
    } else {
        commercialSettings.style.display = 'none';
        commercialsContainer.style.display = 'none';
        addCommercialBtn.style.display = 'none';
    }
    
    validateScreen4Navigation();
}

async function editChannel(channelId) {
    console.log("Iniciando edição do canal:", channelId);
    
    if (!currentUser) {
        alert("É necessário fazer login para editar canais");
        return;
    }
    
    try {
        const doc = await db.collection('users').doc(currentUser.uid).collection('channels').doc(channelId).get();
        
        if (!doc.exists) {
            console.error("Documento não encontrado no banco de dados");
            alert("Canal não encontrado");
            return;
        }
        
        const channel = doc.data();
        console.log("Dados brutos do banco de dados:", channel);
        
        const dadosNormalizados = normalizarDadosCanal(channel);
        console.log("Dados normalizados:", dadosNormalizados);
        
        tvData = { ...dadosNormalizados };
        
        const monetizationData = await carregarConfiguracoesMonetizacao(channelId);
        if (monetizationData) {
            tvData.monetization = monetizationData;
            console.log("Configurações de monetização carregadas:", monetizationData);
        } else {
            tvData.monetization = null;
        }
        
        currentChannelId = channelId;
        editingChannel = true;
        originalChannelName = dadosNormalizados.name;
        
        console.log("Preenchendo formulário...");
        
        document.getElementById('tvEmail').value = tvData.email;
        document.getElementById('tvName').value = tvData.name;
        document.getElementById('tvSlogan').value = tvData.slogan;
        
        if (tvData.logo === DEFAULT_LOGO || !tvData.logo) {
            document.getElementById('tvLogo').value = '';
            document.getElementById('logoPreview').src = DEFAULT_LOGO;
        } else {
            document.getElementById('tvLogo').value = tvData.logo;
            document.getElementById('logoPreview').src = tvData.logo;
        }
        
        document.getElementById('tvNameCounter').textContent = `${tvData.name.length}/50`;
        document.getElementById('tvSloganCounter').textContent = `${tvData.slogan.length}/100`;
        
        document.getElementById('visibilitySelect').value = tvData.visibility;
        document.getElementById('visibilityInfo').textContent = tvData.visibility === 'brazil' 
            ? 'Seu canal será acessível apenas no Brasil' 
            : 'Seu canal será acessível de qualquer país (Mundo)';
        
        document.getElementById('showChannelNameWithLogo').checked = tvData.showChannelNameWithLogo;
        document.getElementById('showTime').checked = tvData.showTime;
        document.getElementById('enableRewind10').checked = tvData.enableRewind10;
        document.getElementById('enableRestart').checked = tvData.enableRestart;
        document.getElementById('enableLive').checked = tvData.enableLive;
        document.getElementById('enableDebug').checked = tvData.enableDebug;
        document.getElementById('customReleaseDate').checked = tvData.customReleaseDate;
        document.getElementById('adultContent').checked = tvData.isAdultContent;
        
        const customReleaseDateCheckbox = document.getElementById('customReleaseDate');
        const releaseDateInput = document.getElementById('releaseDate');
        
        if (tvData.published) {
            document.getElementById('tvName').disabled = true;
            document.getElementById('tvName').classList.add('name-disabled');
            document.getElementById('tvName').title = "O nome não pode ser alterado após a publicação";
            document.getElementById('toScreen2').disabled = false;
        } else {
            document.getElementById('tvName').disabled = false;
            document.getElementById('tvName').classList.remove('name-disabled');
            document.getElementById('toScreen2').disabled = true;
        }
        
        if (tvData.customReleaseDate && tvData.releaseDate) {
            const hoje = new Date().toISOString().split('T')[0];
            releaseDateInput.min = '2025-01-01';
            releaseDateInput.max = hoje;
            releaseDateInput.value = tvData.releaseDate;
            document.getElementById('releaseDateContainer').style.display = 'block';
        } else {
            document.getElementById('releaseDateContainer').style.display = 'none';
        }
        
        updateLogoPreview();
        
        const programmingModeSelect = document.getElementById('programmingMode');
        programmingModeSelect.value = tvData.programmingMode || 'grade';
        alternarModoProgramacao();
        
        const programsContainer = document.getElementById('programsContainer');
        programsContainer.innerHTML = '';
        
        const playlistContainer = document.getElementById('playlistContainer');
        playlistContainer.innerHTML = '';
        
        if (tvData.programs && tvData.programs.length > 0 && tvData.programmingMode === 'grade') {
            tvData.programs.forEach((program, index) => {
                addProgramCard(program, index);
            });
        }
        
        if (tvData.playlistVideos && tvData.playlistVideos.length > 0 && tvData.programmingMode === 'playlist') {
            tvData.playlistVideos.forEach((video, index) => {
                addPlaylistVideoCard(video, index);
            });
        }
        
        const commercialsContainer = document.getElementById('commercialsContainer');
        commercialsContainer.innerHTML = '';
        
        if (tvData.commercials && tvData.commercials.length > 0) {
            tvData.commercials.forEach((commercial, index) => {
                const commercialObj = typeof commercial === 'string' 
                    ? { name: `Comercial ${index + 1}`, url: commercial } 
                    : commercial;
                addCommercialCard(commercialObj, index);
            });
        }
        
        document.getElementById('enableCommercials').checked = tvData.enableCommercials;
        document.getElementById('commercialsPerBreak').value = tvData.commercialsPerBreak;
        
        const commercialsOrderSelect = document.getElementById('commercialsOrder');
        commercialsOrderSelect.value = tvData.commercialsOrder || 'sequential';
        
        toggleCommercialsVisibility();
        
        document.getElementById('facebookUrl').value = tvData.socialMedia.facebook || '';
        document.getElementById('instagramUrl').value = tvData.socialMedia.instagram || '';
        document.getElementById('blueskyUrl').value = tvData.socialMedia.bluesky || '';
        document.getElementById('tiktokUrl').value = tvData.socialMedia.tiktok || '';
        document.getElementById('twitterUrl').value = tvData.socialMedia.twitter || '';
        document.getElementById('customButtonText').value = tvData.customButton.text || '';
        document.getElementById('customButtonUrl').value = tvData.customButton.url || '';
        document.getElementById('customButtonTextCounter').textContent = `${tvData.customButton.text?.length || 0}/20`;
        
        updateCounters();
        validateAddProgramButton();
        validateAddPlaylistVideoButton();
        validateAddCommercialButton();
        validateScreen3Navigation();
        validateScreen4Navigation();
        
        console.log("Formulário preenchido com sucesso. Indo para tela 1...");
        showScreen('screen1');
        
    } catch (error) {
        console.error("Erro detalhado ao carregar canal para edição:", error);
        console.error("Stack trace:", error.stack);
        alert("Erro ao carregar canal. Tente novamente. Detalhes no console.");
    }
}

// Apagar canal completamente
// ✅ Correção: Passa o ID do Firestore para deletarCanalBancoTempoReal
// ============================================================
async function deleteChannel(channelId) {
    if (!currentUser) {
        alert("É necessário fazer login para apagar canais");
        return;
    }
    
    const channel = channels.find(c => c.id === channelId);
    if (!channel) return;
    
    if (confirm('Tem certeza que deseja apagar este canal? Isso removerá o canal do servidor, banco de dados, banco de dados em tempo real e do seu perfil.')) {
        try {
            if (channelViewerListeners[channelId]) {
                channelViewerListeners[channelId].ref.off('value', channelViewerListeners[channelId].listener);
                delete channelViewerListeners[channelId];
            }
            
            let apagadoDoServidor = false;

            const apagadoDoBancoDados = await deletarCanalBancoDados(channelId);
            channels = channels.filter(c => c.id !== channelId);
            
            if (apagadoDoBancoDados) {
                await carregarCanais();
                alert('Canal apagado com sucesso!');
            } else {
                alert('Erro ao apagar canal do banco de dados. Tente novamente.');
            }
            
        } catch (error) {

            alert('Erro ao apagar canal. Tente novamente.');
        }

            const channel = channels.find(c => c.id === channelIdFromMonetize);

                }
                
                setTimeout(() => {

                    showScreen('screen6');
                }, 1000);
                
                const newUrl = window.location.pathname;
                window.history.replaceState({}, document.title, newUrl);
                return;
            }
        }
        
        if (isOnScreen6 && !publicationStarted) {
            console.log("Usuário autenticado na tela 6. Iniciando publicação automática...");
            const authRequiredMessage = document.getElementById('authRequiredMessage');
            if (authRequiredMessage) {
                authRequiredMessage.style.display = 'none';

            }, 500);
        }
    } else {
        channels = [];
        const channelsList = document.getElementById('channelsList');
        const emptyState = document.getElementById('emptyState');
        
        if (channelsList) channelsList.innerHTML = '';
        if (emptyState) emptyState.style.display = 'block';
        
        for (let channelId in channelViewerListeners) {
            if (channelViewerListeners[channelId]) {
                channelViewerListeners[channelId].ref.off('value', channelViewerListeners[channelId].listener);
            }
        }
        channelViewerListeners = {};
        
        if (versionCheckInterval) {
            clearInterval(versionCheckInterval);
            versionCheckInterval = null;
        }
        
        if (isOnScreen6) {
            console.log("Usuário deslogou na tela 6. Mostrando mensagem de autenticação.");
            mostrarMensagemAutenticacao();
            publicationStarted = false;
        }

function isValidUrl(string) {
    try {
        new URL(string);
        return true;
    } catch (_) {
        return false;
    }
}

function isValidEmail(email) {
    const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
    return re.test(String(email).toLowerCase());
}

function isValidSocialMediaUrl(url, platform) {
    if (!url) return true;
    if (!isValidUrl(url)) return false;
    
    const urlObj = new URL(url);
    const hostname = urlObj.hostname;
    
    switch(platform) {
        case 'facebook':
            return hostname === 'facebook.com' || hostname === 'www.facebook.com';
        case 'instagram':
            return hostname === 'instagram.com' || hostname === 'www.instagram.com';
        case 'bluesky':
            return hostname === 'bsky.app' || hostname === 'www.bsky.app';
        case 'tiktok':
            return hostname === 'tiktok.com' || hostname === 'www.tiktok.com';
        case 'twitter':
            return hostname === 'twitter.com' || hostname === 'www.twitter.com' || 
                   hostname === 'x.com' || hostname === 'www.x.com';
        default:
            return true;
    }
}
