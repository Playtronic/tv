<script>
// ============================================================
// CÓDIGO CORRIGIDO - VERSÃO ESTÁVEL
// Carrega a interface PRIMEIRO, depois inicializa funcionalidades
// ============================================================

// --- VARIÁVEIS GLOBAIS ---
let tvData = {};
let currentChannelId = null;
let editingChannel = false;
let originalChannelName = '';
let channels = [];
let channelViewerListeners = {};
let versionCheckInterval = null;
let publicationStarted = false;
let isOnScreen6 = false;
let currentUser = null;

// --- CONSTANTES ---
const DEFAULT_LOGO = 'https://via.placeholder.com/150';
const BRAZIL_FLAG = 'https://flagcdn.com/w40/br.png';
const WORLD_ICON = 'https://cdn-icons-png.flaticon.com/512/3038/3038310.png';
const ADULT_ICON = 'https://cdn-icons-png.flaticon.com/512/2965/2965287.png';
const totalSlots = 58;

// ============================================================
// PASSO 1: MOSTRAR A TELA INICIAL IMEDIATAMENTE
// (Garante que a página nunca fique em branco)
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    console.log('✅ DOM carregado - Mostrando tela inicial');
    
    // Mostrar tela 0 imediatamente
    showScreen('screen0');
    
    // Inicializar UI de autenticação
    updateAuthUI();
    
    // Inicializar event listeners básicos
    initBasicEventListeners();
    
    // Carregar o resto das funcionalidades em segundo plano
    setTimeout(initFullApplication, 100);
});

// ============================================================
// FUNÇÃO BÁSICA: MOSTRAR TELA (FUNCIONA SEM DEPENDÊNCIAS)
// ============================================================
function showScreen(screenId) {
    const todasTelas = ['screen0', 'screen1', 'screen2', 'screen3', 'screen4', 'screen5', 'screen6'];
    
    todasTelas.forEach(id => {
        const tela = document.getElementById(id);
        if (tela) {
            tela.style.display = (id === screenId) ? 'block' : 'none';
        }
    });
    
    isOnScreen6 = (screenId === 'screen6');
    window.scrollTo(0, 0);
    
    console.log(`📺 Tela alterada para: ${screenId}`);
}

// ============================================================
// INICIALIZAR EVENT LISTENERS BÁSICOS
// ============================================================
function initBasicEventListeners() {
    console.log('🔧 Inicializando eventos básicos...');
    
    // Botão de login
    const loginBtn = document.getElementById('loginButton');
    if (loginBtn) {
        loginBtn.addEventListener('click', () => {
            const overlay = document.getElementById('loginOverlay');
            if (overlay) overlay.style.display = 'flex';
        });
    }
    
    // Fechar login
    const closeLogin = document.getElementById('closeLoginBtn');
    if (closeLogin) {
        closeLogin.addEventListener('click', () => {
            const overlay = document.getElementById('loginOverlay');
            if (overlay) overlay.style.display = 'none';
        });
    }
    
    // Botão de logout
    const logoutBtn = document.getElementById('logoutButton');
    if (logoutBtn && typeof auth !== 'undefined') {
        logoutBtn.addEventListener('click', () => {
            auth.signOut().catch(err => console.error('Erro logout:', err));
        });
    }
    
    // Login com Google
    const googleLogin = document.getElementById('googleLoginBtn');
    if (googleLogin && typeof auth !== 'undefined' && typeof firebase !== 'undefined') {
        googleLogin.addEventListener('click', async () => {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('profile');
                provider.addScope('email');
                await auth.signInWithPopup(provider);
                const overlay = document.getElementById('loginOverlay');
                if (overlay) overlay.style.display = 'none';
            } catch (error) {
                alert('Erro no login: ' + error.message);
            }
        });
    }
    
    // Login da tela de publicação
    const loginFromPublish = document.getElementById('loginFromPublish');
    if (loginFromPublish) {
        loginFromPublish.addEventListener('click', () => {
            const overlay = document.getElementById('loginOverlay');
            if (overlay) overlay.style.display = 'flex';
        });
    }
    
    // Botão Criar Novo Canal
    const createBtn = document.getElementById('createNewChannel');
    if (createBtn) {
        createBtn.addEventListener('click', criarNovoCanal);
    }
    
    // Navegação - Voltar para home
    ['backToHome', 'backToHomeFromScreen2', 'backToHomeFromScreen3', 'backToHomeFromScreen4', 'backToHomeFromScreen5', 'backToHomeFromSuccess'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.addEventListener('click', () => showScreen('screen0'));
    });
    
    // Navegação entre telas
    document.getElementById('backToScreen1')?.addEventListener('click', () => showScreen('screen1'));
    document.getElementById('backToScreen2')?.addEventListener('click', () => showScreen('screen2'));
    document.getElementById('backToScreen3')?.addEventListener('click', () => showScreen('screen3'));
    document.getElementById('backToScreen4')?.addEventListener('click', () => showScreen('screen4'));
    document.getElementById('backToScreen5')?.addEventListener('click', () => showScreen('screen5'));
    
    // Avançar telas
    document.getElementById('toScreen2')?.addEventListener('click', avancarParaTela2);
    document.getElementById('toScreen3')?.addEventListener('click', avancarParaTela3);
    document.getElementById('toScreen4')?.addEventListener('click', () => showScreen('screen4'));
    document.getElementById('toScreen5')?.addEventListener('click', () => showScreen('screen5'));
    document.getElementById('toScreen6')?.addEventListener('click', avancarParaTela6);
    
    // Preview da logo
    document.getElementById('tvLogo')?.addEventListener('input', updateLogoPreview);
    document.getElementById('tvLogo')?.addEventListener('change', updateLogoPreview);
    
    // Seletor de visibilidade
    document.getElementById('visibilitySelect')?.addEventListener('change', function() {
        const info = document.getElementById('visibilityInfo');
        if (info) {
            info.textContent = this.value === 'brazil' 
                ? 'Seu canal será acessível apenas no Brasil' 
                : 'Seu canal será acessível de qualquer país';
        }
    });
    
    // Modo de programação
    document.getElementById('programmingMode')?.addEventListener('change', alternarModoProgramacao);
    
    // Habilitar comerciais
    document.getElementById('enableCommercials')?.addEventListener('change', function() {
        const settings = document.getElementById('commercialSettings');
        const container = document.getElementById('commercialsContainer');
        const addBtn = document.getElementById('addCommercial');
        if (settings) settings.style.display = this.checked ? 'block' : 'none';
        if (container) container.style.display = this.checked ? 'block' : 'none';
        if (addBtn) addBtn.style.display = this.checked ? 'block' : 'none';
    });
    
    // Data personalizada
    document.getElementById('customReleaseDate')?.addEventListener('change', function() {
        const container = document.getElementById('releaseDateContainer');
        if (container) container.style.display = this.checked ? 'block' : 'none';
    });
    
    // Retry publicação
    document.getElementById('retryPublish')?.addEventListener('click', function() {
        resetScreen6();
        setTimeout(() => iniciarPublicacao(), 500);
    });
    
    console.log('✅ Eventos básicos inicializados');
}

// ============================================================
// INICIALIZAR APLICAÇÃO COMPLETA
// ============================================================
function initFullApplication() {
    console.log('🚀 Inicializando aplicação completa...');
    
    try {
        // Observador de autenticação Firebase
        if (typeof auth !== 'undefined') {
            auth.onAuthStateChanged(async (user) => {
                console.log('🔐 Auth:', user ? 'Logado' : 'Deslogado');
                currentUser = user;
                updateAuthUI();
                
                if (user) {
                    await carregarCanais();
                    
                    if (isOnScreen6 && !publicationStarted) {
                        const authMsg = document.getElementById('authRequiredMessage');
                        if (authMsg) authMsg.style.display = 'none';
                        resetScreen6();
                        setTimeout(() => iniciarPublicacao(), 500);
                    }
                } else {
                    channels = [];
                    const list = document.getElementById('channelsList');
                    if (list) list.innerHTML = '';
                    
                    if (versionCheckInterval) {
                        clearInterval(versionCheckInterval);
                        versionCheckInterval = null;
                    }
                    
                    if (isOnScreen6) {
                        mostrarMensagemAutenticacao();
                        publicationStarted = false;
                    }
                }
            });
        } else {
            console.warn('⚠️ Firebase Auth não detectado - funcionalidades de login desativadas');
        }
        
        console.log('🎉 Aplicação inicializada com sucesso!');
        
    } catch (error) {
        console.error('❌ Erro na inicialização completa:', error);
        // Mesmo com erro, a página já está carregada graças ao Passo 1
    }
}

// ============================================================
// FUNÇÕES DE UI E NAVEGAÇÃO
// ============================================================

function updateAuthUI() {
    const userInfo = document.getElementById('userInfo');
    const loginButton = document.getElementById('loginButton');
    
    if (currentUser) {
        if (loginButton) loginButton.style.display = 'none';
        if (userInfo) {
            userInfo.style.display = 'flex';
            const userName = document.getElementById('userName');
            if (userName) userName.textContent = currentUser.displayName || currentUser.email || 'Usuário';
            const userEmail = document.getElementById('userEmail');
            if (userEmail) userEmail.textContent = currentUser.email || '';
        }
    } else {
        if (loginButton) loginButton.style.display = 'block';
        if (userInfo) userInfo.style.display = 'none';
        const userCard = document.getElementById('userCard');
        if (userCard) userCard.classList.remove('active');
    }
}

function criarNovoCanal() {
    console.log('➕ Criando novo canal...');
    
    tvData = {
        email: '', name: '', slogan: '', logo: '', visibility: 'brazil',
        showChannelNameWithLogo: true, showTime: true, enableRewind10: true,
        enableRestart: true, enableLive: true, enableDebug: true,
        customReleaseDate: false, releaseDate: '', programmingMode: 'grade',
        programs: [], playlistVideos: [], commercials: [], enableCommercials: false,
        commercialsPerBreak: 2, commercialsOrder: 'sequential', isOffline: false,
        isAdultContent: false, socialMedia: { facebook: '', instagram: '', bluesky: '', tiktok: '', twitter: '' },
        customButton: { text: '', url: '' }, url: '', published: false, version: '1.0.0.0'
    };
    
    currentChannelId = null;
    editingChannel = false;
    originalChannelName = '';
    
    // Limpar formulário
    document.getElementById('tvEmail').value = '';
    document.getElementById('tvName').value = '';
    document.getElementById('tvSlogan').value = '';
    document.getElementById('tvLogo').value = '';
    document.getElementById('logoPreview').src = DEFAULT_LOGO;
    document.getElementById('visibilitySelect').value = 'brazil';
    document.getElementById('visibilityInfo').textContent = 'Seu canal será acessível apenas no Brasil';
    document.getElementById('showChannelNameWithLogo').checked = true;
    document.getElementById('showTime').checked = true;
    document.getElementById('enableRewind10').checked = true;
    document.getElementById('enableRestart').checked = true;
    document.getElementById('enableLive').checked = true;
    document.getElementById('enableDebug').checked = true;
    document.getElementById('customReleaseDate').checked = false;
    document.getElementById('adultContent').checked = false;
    document.getElementById('programmingMode').value = 'grade';
    document.getElementById('releaseDateContainer').style.display = 'none';
    document.getElementById('programsContainer').innerHTML = '';
    document.getElementById('playlistContainer').innerHTML = '';
    document.getElementById('commercialsContainer').innerHTML = '';
    document.getElementById('enableCommercials').checked = false;
    document.getElementById('commercialSettings').style.display = 'none';
    document.getElementById('facebookUrl').value = '';
    document.getElementById('instagramUrl').value = '';
    document.getElementById('blueskyUrl').value = '';
    document.getElementById('tiktokUrl').value = '';
    document.getElementById('twitterUrl').value = '';
    document.getElementById('customButtonText').value = '';
    document.getElementById('customButtonUrl').value = '';
    
    const tvName = document.getElementById('tvName');
    tvName.disabled = false;
    tvName.classList.remove('name-disabled');
    
    alternarModoProgramacao();
    showScreen('screen1');
}

function avancarParaTela2() {
    const email = document.getElementById('tvEmail').value.trim();
    const nome = document.getElementById('tvName').value.trim();
    
    if (!isValidEmail(email)) {
        alert('Por favor, insira um e-mail válido.');
        return;
    }
    
    if (nome.length < 3) {
        alert('O nome do canal deve ter pelo menos 3 caracteres.');
        return;
    }
    
    tvData.email = email;
    tvData.name = nome;
    tvData.slogan = document.getElementById('tvSlogan').value.trim();
    tvData.logo = document.getElementById('tvLogo').value.trim();
    
    showScreen('screen2');
}

function avancarParaTela3() {
    tvData.visibility = document.getElementById('visibilitySelect').value;
    tvData.showChannelNameWithLogo = document.getElementById('showChannelNameWithLogo').checked;
    tvData.showTime = document.getElementById('showTime').checked;
    tvData.enableRewind10 = document.getElementById('enableRewind10').checked;
    tvData.enableRestart = document.getElementById('enableRestart').checked;
    tvData.enableLive = document.getElementById('enableLive').checked;
    tvData.enableDebug = document.getElementById('enableDebug').checked;
    tvData.customReleaseDate = document.getElementById('customReleaseDate').checked;
    tvData.isAdultContent = document.getElementById('adultContent').checked;
    tvData.releaseDate = tvData.customReleaseDate ? document.getElementById('releaseDate').value : '';
    
    showScreen('screen3');
}

function avancarParaTela6() {
    tvData.socialMedia = {
        facebook: document.getElementById('facebookUrl').value.trim(),
        instagram: document.getElementById('instagramUrl').value.trim(),
        bluesky: document.getElementById('blueskyUrl').value.trim(),
        tiktok: document.getElementById('tiktokUrl').value.trim(),
        twitter: document.getElementById('twitterUrl').value.trim()
    };
    tvData.customButton = {
        text: document.getElementById('customButtonText').value.trim(),
        url: document.getElementById('customButtonUrl').value.trim()
    };
    showScreen('screen6');
}

function updateLogoPreview() {
    const tvLogo = document.getElementById('tvLogo');
    const logoPreview = document.getElementById('logoPreview');
    
    if (tvLogo && logoPreview) {
        const url = tvLogo.value;
        if (url) {
            logoPreview.src = url;
            tvData.logo = url;
            logoPreview.onerror = () => {
                logoPreview.src = DEFAULT_LOGO;
            };
        } else {
            logoPreview.src = DEFAULT_LOGO;
            tvData.logo = '';
        }
    }
}

function alternarModoProgramacao() {
    const select = document.getElementById('programmingMode');
    const grade = document.getElementById('gradeModeContainer');
    const playlist = document.getElementById('playlistModeContainer');
    const info = document.getElementById('programmingModeInfo');
    
    if (!select) return;
    
    const modo = select.value;
    tvData.programmingMode = modo;
    
    if (grade) grade.style.display = (modo === 'grade') ? 'block' : 'none';
    if (playlist) playlist.style.display = (modo === 'playlist') ? 'block' : 'none';
    if (info) {
        info.innerHTML = 'Modo Grade: 58 programas fixos, cada programa tem vídeos para cada dia.<br>Modo Playlist: Lista de vídeos em sequência contínua.';
    }
}

function mostrarMensagemAutenticacao() {
    const msg = document.getElementById('authRequiredMessage');
    if (msg) msg.style.display = 'block';
}

function resetScreen6() {
    ['publishingStatus', 'processingMessage', 'successMessage', 'serverResult', 'authRequiredMessage'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
    });
}

// ============================================================
// FUNÇÕES AUXILIARES
// ============================================================

function isValidUrl(string) {
    try { new URL(string); return true; } catch (_) { return false; }
}

function isValidEmail(email) {
    const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
    return re.test(String(email).toLowerCase());
}

// ============================================================
// FUNÇÕES PRINCIPAIS (COM TRATAMENTO DE ERRO)
// ============================================================

async function carregarCanais() {
    if (!currentUser || typeof db === 'undefined') return;
    
    try {
        console.log('📋 Carregando canais...');
        const channelsList = document.getElementById('channelsList');
        const emptyState = document.getElementById('emptyState');
        channels = [];
        
        if (channelsList) channelsList.innerHTML = '';
        
        // Limpar listeners antigos
        for (let cid in channelViewerListeners) {
            if (channelViewerListeners[cid]) {
                channelViewerListeners[cid].ref.off('value', channelViewerListeners[cid].listener);
            }
        }
        channelViewerListeners = {};
        
        const querySnapshot = await db.collection('users').doc(currentUser.uid)
            .collection('channels')
            .orderBy('updatedAt', 'desc')
            .get();
        
        querySnapshot.forEach(doc => {
            const data = doc.data();
            channels.push({ id: doc.id, ...normalizarDados(data) });
        });
        
        if (channels.length === 0) {
            if (emptyState) emptyState.style.display = 'block';
            if (channelsList) channelsList.style.display = 'none';
            return;
        }
        
        if (emptyState) emptyState.style.display = 'none';
        if (channelsList) {
            channelsList.style.display = 'grid';
            
            channels.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.setAttribute('data-channel', channel.id);
                
                const nomeArquivo = channel.name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-') + '.html';
                const urlCanal = channel.url || `https://canaisdetv.online/canais/${nomeArquivo}`;
                const isOffline = channel.isOffline || false;
                const isPublished = channel.published || false;
                const isAdult = channel.isAdultContent || false;
                
                let statusText = isOffline ? 'Fora do ar' : (isPublished ? 'Publicado' : 'Não publicado');
                let statusClass = isOffline ? 'status-offline' : (isPublished ? 'status-published' : 'status-unpublished');
                
                card.innerHTML = `
                    <img src="${channel.logo || DEFAULT_LOGO}" class="channel-logo-small" alt="Logo">
                    <div class="channel-name-with-emoji"><h3>${channel.name}</h3></div>
                    <img src="${channel.visibility === 'brazil' ? BRAZIL_FLAG : WORLD_ICON}" class="visibility-icon" style="width:25px;height:25px;">
                    ${isAdult ? `<img src="${ADULT_ICON}" class="adult-content-icon" style="width:25px;height:25px;">` : ''}
                    <p class="spectators" id="spectators-${channel.id}">
                        <span style="display:inline-block;width:8px;height:8px;background:#ff4444;border-radius:50%;margin-right:5px;"></span>
                        <span class="spectator-count">0</span> espectadores
                    </p>
                    <div class="channel-status ${statusClass}">${statusText}</div>
                    <div class="channel-actions">
                        ${urlCanal && !urlCanal.includes('/.html') ? `<button class="watch-channel" data-url="${urlCanal}">Abrir</button>` : ''}
                        <button class="edit-channel" data-id="${channel.id}">Editar</button>
                        <button class="monetize-channel" data-id="${channel.id}">Monetizar</button>
                        <button class="toggle-offline-channel" data-id="${channel.id}" data-offline="${isOffline}">
                            ${isOffline ? 'Reativar' : 'Tirar do Ar'}
                        </button>
                        <button class="delete-channel delete-button" data-id="${channel.id}">Apagar</button>
                    </div>
                `;
                
                channelsList.appendChild(card);
                
                // Eventos
                card.querySelector('.watch-channel')?.addEventListener('click', (e) => {
                    window.open(e.target.getAttribute('data-url'), '_blank');
                });
                
                card.querySelector('.edit-channel')?.addEventListener('click', (e) => {
                    editChannel(e.target.getAttribute('data-id'));
                });
                
                card.querySelector('.monetize-channel')?.addEventListener('click', (e) => {
                    window.location.href = `monetizar.html?channelId=${e.target.getAttribute('data-id')}`;
                });
                
                card.querySelector('.toggle-offline-channel')?.addEventListener('click', (e) => {
                    toggleChannelOffline(e.target.getAttribute('data-id'), e.target.getAttribute('data-offline') === 'true');
                });
                
                card.querySelector('.delete-channel')?.addEventListener('click', (e) => {
                    deleteChannel(e.target.getAttribute('data-id'));
                });
                
                // Monitorar espectadores
                if (!isOffline && isPublished && typeof rtdb !== 'undefined') {
                    const ref = rtdb.ref('onlineUsers/' + channel.id);
                    const listener = ref.on('value', (snap) => {
                        const el = document.getElementById(`spectators-${channel.id}`);
                        if (!el) return;
                        const count = el.querySelector('.spectator-count');
                        if (count) count.textContent = snap.exists() ? Object.keys(snap.val()).length : 0;
                    });
                    channelViewerListeners[channel.id] = { ref, listener };
                }
            });
        }
        
        console.log(`✅ ${channels.length} canais carregados`);
        
    } catch (error) {
        console.error('❌ Erro ao carregar canais:', error);
    }
}

function normalizarDados(data) {
    return {
        ...data,
        name: data.name || '',
        logo: data.logo || DEFAULT_LOGO,
        visibility: data.visibility || 'brazil',
        programs: Array.isArray(data.programs) ? data.programs : [],
        playlistVideos: Array.isArray(data.playlistVideos) ? data.playlistVideos : [],
        commercials: Array.isArray(data.commercials) ? data.commercials : []
    };
}

async function editChannel(channelId) {
    if (!currentUser || typeof db === 'undefined') {
        alert('Login necessário');
        return;
    }
    
    try {
        const doc = await db.collection('users').doc(currentUser.uid).collection('channels').doc(channelId).get();
        if (!doc.exists) { alert('Canal não encontrado'); return; }
        
        const data = normalizarDados(doc.data());
        tvData = { ...data };
        currentChannelId = channelId;
        editingChannel = true;
        originalChannelName = data.name;
        
        // Preencher formulário
        document.getElementById('tvEmail').value = data.email || '';
        document.getElementById('tvName').value = data.name;
        document.getElementById('tvSlogan').value = data.slogan || '';
        document.getElementById('tvLogo').value = (data.logo === DEFAULT_LOGO) ? '' : data.logo;
        document.getElementById('logoPreview').src = data.logo || DEFAULT_LOGO;
        document.getElementById('visibilitySelect').value = data.visibility || 'brazil';
        document.getElementById('showChannelNameWithLogo').checked = data.showChannelNameWithLogo !== false;
        document.getElementById('showTime').checked = data.showTime !== false;
        document.getElementById('enableRewind10').checked = data.enableRewind10 !== false;
        document.getElementById('enableRestart').checked = data.enableRestart !== false;
        document.getElementById('enableLive').checked = data.enableLive !== false;
        document.getElementById('enableDebug').checked = data.enableDebug !== false;
        document.getElementById('customReleaseDate').checked = !!data.customReleaseDate;
        document.getElementById('adultContent').checked = !!data.isAdultContent;
        document.getElementById('programmingMode').value = data.programmingMode || 'grade';
        
        if (data.published) {
            document.getElementById('tvName').disabled = true;
            document.getElementById('tvName').classList.add('name-disabled');
        }
        
        alternarModoProgramacao();
        showScreen('screen1');
        
    } catch (error) {
        console.error('❌ Erro ao editar:', error);
        alert('Erro ao carregar canal');
    }
}

async function toggleChannelOffline(channelId, isOffline) {
    if (!currentUser || typeof db === 'undefined') return;
    
    try {
        const doc = await db.collection('users').doc(currentUser.uid).collection('channels').doc(channelId).get();
        if (!doc.exists) return;
        
        const data = normalizarDados(doc.data());
        tvData = { ...data };
        tvData.isOffline = !isOffline;
        currentChannelId = channelId;
        editingChannel = true;
        originalChannelName = data.name;
        
        showScreen('screen6');
        
    } catch (error) {
        console.error('❌ Erro:', error);
        alert('Erro ao modificar canal');
    }
}

async function deleteChannel(channelId) {
    if (!currentUser) return;
    
    const channel = channels.find(c => c.id === channelId);
    if (!channel) return;
    
    if (!confirm(`Tem certeza que deseja apagar "${channel.name}"?`)) return;
    
    try {
        if (channelViewerListeners[channelId]) {
            channelViewerListeners[channelId].ref.off('value', channelViewerListeners[channelId].listener);
            delete channelViewerListeners[channelId];
        }
        
        await db.collection('users').doc(currentUser.uid).collection('channels').doc(channelId).delete();
        channels = channels.filter(c => c.id !== channelId);
        await carregarCanais();
        alert('Canal apagado com sucesso!');
        
    } catch (error) {
        console.error('❌ Erro:', error);
        alert('Erro ao apagar canal');
    }
}

async function iniciarPublicacao() {
    if (!currentUser) {
        mostrarMensagemAutenticacao();
        return;
    }
    
    publicationStarted = true;
    
    if (!currentChannelId && !editingChannel) {
        const nomeNorm = tvData.name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
        currentChannelId = `temp-${Date.now()}-${nomeNorm}`;
    }
    
    tvData.version = editingChannel ? '1.0.0.' + (Date.now() % 1000) : '1.0.0.0';
    
    try {
        const publishingStatus = document.getElementById('publishingStatus');
        const processingMessage = document.getElementById('processingMessage');
        const successMessage = document.getElementById('successMessage');
        
        if (publishingStatus) {
            publishingStatus.style.display = 'block';
            publishingStatus.querySelector('.progress-bar').style.width = '30%';
        }
        
        await new Promise(r => setTimeout(r, 1000));
        
        if (publishingStatus) publishingStatus.style.display = 'none';
        if (processingMessage) {
            processingMessage.style.display = 'block';
            processingMessage.querySelector('.progress-bar').style.width = '60%';
        }
        
        // Simular publicação (substitua pela sua lógica real)
        await new Promise(r => setTimeout(r, 2000));
        
        // Salvar no Firestore se disponível
        if (typeof db !== 'undefined' && typeof firebase !== 'undefined') {
            const userId = currentUser.uid;
            const now = firebase.firestore.FieldValue.serverTimestamp();
            
            const channelToSave = {
                ...tvData,
                userId,
                updatedAt: now,
                published: true
            };
            
            if (currentChannelId.startsWith('temp-')) {
                const docRef = await db.collection('users').doc(userId).collection('channels').add({
                    ...channelToSave,
                    createdAt: now
                });
                currentChannelId = docRef.id;
            } else {
                await db.collection('users').doc(userId).collection('channels').doc(currentChannelId).update(channelToSave);
            }
        }
        
        if (processingMessage) processingMessage.style.display = 'none';
        if (successMessage) {
            successMessage.style.display = 'block';
            successMessage.innerHTML = `
                <h3>✅ ${editingChannel ? 'Canal Atualizado!' : 'Canal Publicado!'}</h3>
                <p>Seu canal já está disponível!</p>
            `;
        }
        
        publicationStarted = false;
        await carregarCanais();
        
    } catch (error) {
        console.error('❌ Erro publicação:', error);
        alert('Erro ao publicar: ' + error.message);
        publicationStarted = false;
    }
}
</script>
