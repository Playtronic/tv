<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canais de TV Online</title>
<link rel="icon" href="https://raw.githubusercontent.com/Playtronic/tv/refs/heads/main/template/favicon.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#1a2a6c 0%,#2a1a4c 50%,#0d0d1a 100%);background-attachment:fixed;color:#fff;min-height:100vh;padding-bottom:40px}

header{padding:20px 32px 14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;background:rgba(13,13,26,0.85);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid rgba(255,255,255,0.08)}
.logo-header{display:flex;align-items:center;gap:12px;font-size:1.3rem;font-weight:bold;color:#fdbb2d}
.logo-header img{width:38px;height:38px;border-radius:8px}
.search-box{flex:1;min-width:200px;max-width:400px}
.search-box input{width:100%;padding:10px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#fff;font-size:0.95rem;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:#fdbb2d}
.search-box input::placeholder{color:rgba(255,255,255,0.4)}

#status{padding:60px 20px;text-align:center;opacity:.7}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,0.1);border-top-color:#fdbb2d;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.section{margin:26px 0}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:0 32px;margin-bottom:12px}
.section-title{font-size:1.25rem;font-weight:bold;color:#fdbb2d;display:flex;align-items:center;gap:8px}
.section-title small{font-size:0.78rem;opacity:.6;color:#fff;font-weight:normal;margin-left:6px}
.carousel-nav{display:flex;gap:6px}
.carousel-nav button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;transition:all .2s;display:flex;align-items:center;justify-content:center}
.carousel-nav button:hover{background:#fdbb2d;color:#000;border-color:#fdbb2d}
.carousel-nav button:disabled{opacity:.25;cursor:not-allowed}

.carousel{display:flex;gap:14px;overflow-x:auto;padding:6px 32px 14px;scroll-behavior:smooth;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}

.card{flex:0 0 200px;scroll-snap-align:start;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;transition:all .25s;position:relative}
.card:hover{transform:translateY(-4px);background:rgba(255,255,255,0.1);border-color:rgba(253,187,45,0.4);box-shadow:0 12px 24px rgba(0,0,0,0.35)}

.card-logo{width:88px;height:88px;border-radius:12px;object-fit:cover;background:#222;border:2px solid rgba(255,255,255,0.1);margin-bottom:10px}
.card-name{font-size:0.92rem;font-weight:bold;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px;text-shadow:0 1px 2px rgba(0,0,0,0.4)}
.card-program{font-size:0.76rem;text-align:center;color:#fdbb2d;width:100%;height:30px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3;opacity:.9;margin-bottom:6px}
.card-viewers{font-size:0.72rem;color:#2ecc71;margin-bottom:8px;font-weight:bold}
.card-viewers::before{content:'●';color:#e74c3c;margin-right:5px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.card-actions{display:flex;gap:6px;width:100%;margin-top:auto}
.card-actions button,.card-actions a{padding:8px 10px;border:none;border-radius:8px;font-size:0.82rem;font-weight:bold;cursor:pointer;transition:all .2s;text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px}
.fav-btn{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2)!important;flex:0 0 36px!important;font-size:1rem!important}
.fav-btn:hover{background:rgba(253,187,45,0.3);border-color:#fdbb2d!important}
.fav-btn.active{background:#fdbb2d;color:#000;border-color:#fdbb2d!important}
.watch-btn{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;flex:1!important}
.watch-btn:hover{background:linear-gradient(135deg,#27ae60,#229954);transform:scale(1.02)}
.adult-badge{position:absolute;top:8px;right:8px;background:#e74c3c;color:#fff;font-size:.65rem;font-weight:bold;padding:2px 6px;border-radius:4px;z-index:2}
.empty-msg{padding:12px 32px;font-size:.9rem;opacity:.5;font-style:italic}

@media(max-width:640px){
  header{padding:14px 18px 10px}
  .section-header{padding:0 18px}
  .carousel{padding:6px 18px 14px}
  .card{flex:0 0 165px;padding:12px 10px}
  .card-logo{width:68px;height:68px}
  .card-name{font-size:.85rem}
  .section-title{font-size:1.05rem}
  .empty-msg{padding:12px 18px}
}
</style>
</head>
<body>

<header>
  <div class="logo-header">
    <img src="https://raw.githubusercontent.com/Playtronic/tv/refs/heads/main/template/favicon.png" alt="Canais de TV Online">
    <span>Canais de TV Online</span>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍  Buscar canal ou categoria...">
  </div>
</header>

<div id="status"><div class="spinner"></div><p>Carregando canais...</p></div>
<main id="main"></main>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAfD0QOlAVb50612u6siwCxzfZfGmgEB2E",
  authDomain: "playtronic-tv.firebaseapp.com",
  projectId: "playtronic-tv",
  storageBucket: "playtronic-tv.firebasestorage.app",
  messagingSenderId: "272337341020",
  appId: "1:272337341020:web:a30d949985fd614b5c7499",
  databaseURL: "https://playtronic-tv-default-rtdb.firebaseio.com"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const rtdb = firebase.database();

const DEFAULT_LOGO = "https://raw.githubusercontent.com/Playtronic/tv/refs/heads/main/template/logotv.png";
const CATEGORY_NAMES = {
  noticias:'Notícias', esportes:'Esportes', filmes:'Filmes', series:'Séries',
  novelas:'Novelas', animes:'Animes e Tokusatsus', desenhos:'Desenhos Animados',
  infantil:'Infantil', documentarios:'Documentários', musica:'Música',
  variedades:'Variedades', humor:'Humor', games:'Games', religioso:'Religioso',
  retransmissoes:'Retransmissões', adulto:'Adulto (18+)', outros:'Outros'
};
const FAVORITES_KEY = 'playtronic_favorites_v1';

let allChannels = [];
let favorites = [];
let searchTerm = '';

function getFavorites(){ try{ const r=localStorage.getItem(FAVORITES_KEY); return r?JSON.parse(r):[]; }catch(e){ return []; } }
function saveFavorites(a){ try{ localStorage.setItem(FAVORITES_KEY, JSON.stringify(a)); }catch(e){} }
function isFavorite(id){ return favorites.indexOf(id) !== -1; }
function toggleFavorite(id){
  const i = favorites.indexOf(id);
  if (i === -1) favorites.push(id); else favorites.splice(i,1);
  saveFavorites(favorites);
  render();
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getCurrentProgram(c){
  const names = c.programNames;
  if (!names || names.length === 0) return c.slogan || 'Programação ao vivo';
  const SLOT = 25;
  const now = new Date();
  let idx = 0;
  if (c.programmingMode === 'playlist' && c.releaseDate){
    const p = String(c.releaseDate).split('-').map(Number);
    if (p.length === 3 && !isNaN(p[0])){
      const rel = new Date(p[0], p[1]-1, p[2], 6, 0, 0, 0);
      const d = Math.floor((now.getTime() - rel.getTime()) / 60000);
      if (d >= 0) idx = Math.floor(d / SLOT);
    }
  } else {
    const a = new Date(now);
    if (a.getHours() < 6) a.setDate(a.getDate() - 1);
    a.setHours(6,0,0,0);
    const d = Math.floor((now.getTime() - a.getTime()) / 60000);
    idx = Math.floor(d / SLOT);
  }
  return names[idx % names.length] || names[0];
}

async function loadAll(){
  const statusEl = document.getElementById('status');
  statusEl.style.display = 'block';
  statusEl.innerHTML = '<div class="spinner"></div><p>Carregando canais...</p>';
  try {
    const snap = await db.collection('channels').get();
    const channels = [];
    snap.forEach(doc => {
      const d = doc.data();
      if (d.isOffline === true) return;
      if (!d.url) return;
      channels.push({
        id: doc.id,
        name: d.name || 'Sem nome',
        slogan: d.slogan || '',
        logo: d.logo || DEFAULT_LOGO,
        category: d.category || 'outros',
        url: d.url,
        isAdultContent: !!d.isAdultContent,
        programmingMode: d.programmingMode || 'grade',
        releaseDate: d.releaseDate || '',
        programNames: Array.isArray(d.programNames) ? d.programNames : [],
        createdAt: d.createdAt ? (d.createdAt.toMillis ? d.createdAt.toMillis() : Number(d.createdAt)) : 0,
        updatedAt: d.updatedAt ? (d.updatedAt.toMillis ? d.updatedAt.toMillis() : Number(d.updatedAt)) : 0,
        onlineCount: 0, likes: 0, dislikes: 0, totalVotes: 0
      });
    });

    await Promise.all(channels.map(async c => {
      try {
        const s = await rtdb.ref('onlineUsers/' + c.id).once('value');
        if (s.exists()){
          const v = s.val(); const now = Date.now(); let cnt = 0;
          Object.keys(v).forEach(k => {
            const viewer = v[k]; if (!viewer) return;
            const hb = viewer.lastHeartbeat || viewer.timestamp || 0;
            if (now - hb < 90000) cnt++;
          });
          c.onlineCount = cnt;
        }
      } catch(e){}
    }));

    await Promise.all(channels.map(async c => {
      try {
        const s = await rtdb.ref('channelStats/' + c.id).once('value');
        if (s.exists()){
          const v = s.val() || {};
          c.likes = Number(v.likes) || 0;
          c.dislikes = Number(v.dislikes) || 0;
          c.totalVotes = c.likes + c.dislikes;
        }
      } catch(e){}
    }));

    allChannels = channels;
    favorites = getFavorites();
    render();
    statusEl.style.display = 'none';

    setInterval(refreshOnlineCounts, 60000);
  } catch(e){
    console.error(e);
    statusEl.innerHTML = '<p style="color:#ef4444">Erro ao carregar canais. Recarregue a página.</p>';
  }
}

async function refreshOnlineCounts(){
  await Promise.all(allChannels.map(async c => {
    try {
      const s = await rtdb.ref('onlineUsers/' + c.id).once('value');
      let cnt = 0;
      if (s.exists()){
        const v = s.val(); const now = Date.now();
        Object.keys(v).forEach(k => {
          const viewer = v[k]; if (!viewer) return;
          const hb = viewer.lastHeartbeat || viewer.timestamp || 0;
          if (now - hb < 90000) cnt++;
        });
      }
      c.onlineCount = cnt;
    } catch(e){}
  }));
  render();
}

function matchesSearch(c){
  if (!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  return c.name.toLowerCase().includes(t)
      || (c.slogan || '').toLowerCase().includes(t)
      || (CATEGORY_NAMES[c.category] || '').toLowerCase().includes(t);
}

function makeCard(c){
  const fav = isFavorite(c.id);
  const badge = c.isAdultContent ? '<div class="adult-badge">18+</div>' : '';
  const viewers = c.onlineCount > 0 ? `<div class="card-viewers">${c.onlineCount} assistindo</div>` : '';
  const program = getCurrentProgram(c);
  return `
    <div class="card">
      ${badge}
      <img class="card-logo" src="${escapeHtml(c.logo)}" alt="${escapeHtml(c.name)}"
           onerror="this.onerror=null;this.src='${DEFAULT_LOGO}';">
      <div class="card-name" title="${escapeHtml(c.name)}">${escapeHtml(c.name)}</div>
      <div class="card-program" title="${escapeHtml(program)}">${escapeHtml(program)}</div>
      ${viewers}
      <div class="card-actions">
        <button class="fav-btn ${fav?'active':''}" data-fav="${escapeHtml(c.id)}" title="${fav?'Remover dos favoritos':'Adicionar aos favoritos'}">${fav?'★':'☆'}</button>
        <a class="watch-btn" href="${escapeHtml(c.url)}" target="_blank" rel="noopener">▶ Assistir</a>
      </div>
    </div>`;
}

function makeSection(title, emoji, channels, opts){
  opts = opts || {};
  if (!channels || channels.length === 0){
    if (opts.hideIfEmpty) return '';
    return `<section class="section">
      <div class="section-header"><div class="section-title">${emoji} ${escapeHtml(title)}</div></div>
      <div class="empty-msg">${opts.emptyMsg || 'Nenhum canal nesta seção.'}</div>
    </section>`;
  }
  const cards = channels.map(makeCard).join('');
  const cnt = opts.countLabel ? `<small>${channels.length} canal${channels.length!==1?'s':''}</small>` : '';
  return `<section class="section">
    <div class="section-header">
      <div class="section-title">${emoji} ${escapeHtml(title)}${cnt}</div>
      <div class="carousel-nav">
        <button data-scroll="left" data-target="sec-${escapeHtml(opts.key)}">‹</button>
        <button data-scroll="right" data-target="sec-${escapeHtml(opts.key)}">›</button>
      </div>
    </div>
    <div class="carousel" id="sec-${escapeHtml(opts.key)}">${cards}</div>
  </section>`;
}

function render(){
  const main = document.getElementById('main');
  const visible = allChannels.filter(matchesSearch);

  if (visible.length === 0){
    main.innerHTML = `<div style="padding:60px 20px;text-align:center;opacity:.6"><p>Nenhum canal encontrado.</p></div>`;
    return;
  }

  const now = Date.now();
  const DAY = 24*60*60*1000;

  const favChannels = visible.filter(c => isFavorite(c.id));

  const online = visible.filter(c => c.onlineCount > 0)
    .sort((a,b) => b.onlineCount - a.onlineCount).slice(0,20);

  const topRated = visible.filter(c => c.totalVotes >= 5)
    .sort((a,b) => {
      const ra = a.likes/a.totalVotes, rb = b.likes/b.totalVotes;
      if (rb !== ra) return rb - ra;
      return b.totalVotes - a.totalVotes;
    }).slice(0,20);

  const newChannels = visible.filter(c => c.createdAt > 0 && (now - c.createdAt) < 30*DAY)
    .sort((a,b) => b.createdAt - a.createdAt).slice(0,20);

  const byCategory = {};
  visible.forEach(c => {
    const cat = c.category || 'outros';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(c);
  });

  const abandoned = visible.filter(c => {
    if (c.onlineCount > 0) return false;
    if (c.totalVotes > 0) return false;
    const ref = c.createdAt > 0 ? c.createdAt : c.updatedAt;
    if (!ref) return false;
    return (now - ref) > 3*DAY;
  }).slice(0,20);

  let html = '';

  // SEARCH: só resultados + favoritos filtrados
  if (searchTerm){
    if (favChannels.length > 0){
      html += makeSection('Seus Favoritos', '⭐', favChannels, { key:'fav-s', countLabel:true });
    }
    html += makeSection(`Resultados: "${searchTerm}"`, '🔍', visible, { key:'search', countLabel:true });
    main.innerHTML = html;
    wireEvents(main);
    return;
  }

  // 1. Favoritos
  if (favChannels.length > 0){
    html += makeSection('Seus Favoritos', '⭐', favChannels, { key:'favorites', countLabel:true });
  } else {
    html += `<section class="section">
      <div class="section-header"><div class="section-title">⭐ Seus Favoritos</div></div>
      <div class="empty-msg">Clique na ☆ de qualquer canal para adicioná-lo aos seus favoritos.</div>
    </section>`;
  }

  // 2. Online agora
  html += makeSection('Assistindo Agora', '🔴', online, { key:'online', hideIfEmpty:true, countLabel:true });

  // 3. Melhores avaliados
  html += makeSection('Melhores Avaliados', '🏆', topRated, { key:'top', hideIfEmpty:true, countLabel:true });

  // 4. Novos
  html += makeSection('Novos Canais', '🆕', newChannels, { key:'new', hideIfEmpty:true, countLabel:true });

  // 5+. Categorias
  Object.keys(CATEGORY_NAMES).forEach(cat => {
    const list = byCategory[cat];
    if (!list || list.length === 0) return;
    html += makeSection(CATEGORY_NAMES[cat], '📺', list, { key:'cat-'+cat, countLabel:true });
  });

  // Última: abandonados
  html += makeSection('Canais Esquecidos', '💤', abandoned, { key:'abandoned', hideIfEmpty:true, countLabel:true });

  main.innerHTML = html;
  wireEvents(main);
}

function wireEvents(main){
  main.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      toggleFavorite(btn.getAttribute('data-fav'));
    });
  });
  main.querySelectorAll('.carousel-nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-target');
      const car = document.getElementById(id);
      if (!car) return;
      const dir = btn.getAttribute('data-scroll') === 'right' ? 1 : -1;
      car.scrollBy({ left: dir * 450, behavior: 'smooth' });
    });
  });
  setTimeout(updateNavButtons, 100);
  main.querySelectorAll('.carousel').forEach(c => c.addEventListener('scroll', updateNavButtons));
}

function updateNavButtons(){
  document.querySelectorAll('.carousel').forEach(car => {
    const nav = document.querySelector(`.carousel-nav [data-target="${car.id}"]`);
    if (!nav) return;
    const p = nav.parentElement;
    const l = p.querySelector('[data-scroll="left"]');
    const r = p.querySelector('[data-scroll="right"]');
    if (!l || !r) return;
    l.disabled = car.scrollLeft <= 5;
    r.disabled = car.scrollLeft + car.clientWidth >= car.scrollWidth - 5;
  });
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.trim();
  render();
});

loadAll();
</script>
</body>
</html>
