<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canais de TV Online</title>
<link rel="icon" href="https://raw.githubusercontent.com/Playtronic/tv/refs/heads/main/template/favicon.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:linear-gradient(135deg,#0d1b3e 0%,#1a0d33 35%,#2a0d2a 65%,#0a0a1a 100%);
  background-attachment:fixed;
  color:#fff;
  min-height:100vh;
  padding-bottom:40px;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 15% 20%, rgba(253,187,45,0.08) 0%, transparent 45%),
             radial-gradient(circle at 85% 80%, rgba(155,89,182,0.10) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
}

/* ═══════════ HEADER ═══════════ */
header{
  padding:2px 32px;
  display:flex;
  align-items:center;
  gap:24px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  background:rgba(90, 60, 140, 0.55);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  z-index:100;
  border-bottom:1px solid rgba(180,150,220,0.20);
}
.logo-header{
  display:flex;
  align-items:center;
  gap:16px;
  font-size:1.65rem;
  font-weight:bold;
  color:#fdbb2d;
  text-shadow:0 2px 12px rgba(253,187,45,0.45);
  white-space:nowrap;
}
.logo-header img{
  width:110px;
  height:110px;
  object-fit:contain;
  flex-shrink:0;
  display:block;
}
.header-right{display:flex;align-items:center;gap:14px;margin-left:auto}
.search-box{width:280px}
.search-box input{
  width:100%;padding:11px 18px;border-radius:24px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06);
  color:#fff;font-size:0.9rem;outline:none;
  transition:all .2s;
}
.search-box input:focus{border-color:#fdbb2d;background:rgba(255,255,255,0.1);box-shadow:0 0 0 3px rgba(253,187,45,0.15)}
.search-box input::placeholder{color:rgba(255,255,255,0.4)}

.login-button{
  background:#e67e22;border:none;color:#fff;
  padding:9px 18px;border-radius:22px;cursor:pointer;
  font-size:0.88rem;font-weight:bold;
  transition:all .25s;
  box-shadow:0 3px 10px rgba(230,126,34,0.3);
  white-space:nowrap;
}
.login-button:hover{background:#d35400;transform:translateY(-1px);box-shadow:0 5px 14px rgba(230,126,34,0.4)}

.user-info{display:none;align-items:center;position:relative}
.user-info.active{display:flex}
.user-avatar{
  width:42px;height:42px;border-radius:50%;
  border:2px solid #fdbb2d;cursor:pointer;
  transition:transform .2s;
  object-fit:cover;
}
.user-avatar:hover{transform:scale(1.06)}
.user-card{
  position:absolute;top:52px;right:0;
  background:#e67e22;border-radius:10px;padding:14px 16px;
  box-shadow:0 8px 24px rgba(0,0,0,0.45);
  display:none;flex-direction:column;min-width:220px;
  z-index:200;
}
.user-card.active{display:flex}
.user-name{font-weight:bold;font-size:0.92rem;color:#fff;margin-bottom:2px}
.user-email{font-size:0.78rem;color:rgba(255,255,255,0.85);margin-bottom:12px;word-break:break-all}
.logout-btn{
  background:#c0392b;color:#fff;border:none;
  padding:8px 12px;border-radius:6px;
  cursor:pointer;font-size:0.82rem;font-weight:bold;
  transition:background .2s;
}
.logout-btn:hover{background:#e74c3c}

/* ═══════════ LOGIN MODAL ═══════════ */
.login-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.85);
  display:none;justify-content:center;align-items:center;
  z-index:2000;padding:20px;
}
.login-overlay.active{display:flex}
.login-modal{
  background:linear-gradient(135deg,#1a2a6c,#b21f1f);
  padding:40px 32px;border-radius:16px;text-align:center;
  max-width:420px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}
.login-modal h2{color:#fdbb2d;margin-bottom:16px;font-size:1.4rem}
.login-modal p{color:rgba(255,255,255,0.9);margin-bottom:24px;line-height:1.5;font-size:0.95rem}
.google-login-btn{
  background:#4285f4;color:#fff;border:none;
  padding:13px 24px;border-radius:8px;cursor:pointer;
  font-size:1rem;font-weight:bold;
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;margin-bottom:12px;transition:background .2s;
}
.google-login-btn:hover{background:#3367d6}
.close-login-btn{
  background:rgba(255,255,255,0.1);color:#fff;
  border:1px solid #fdbb2d;padding:11px 20px;border-radius:8px;
  cursor:pointer;width:100%;transition:background .2s;
  font-size:0.95rem;
}
.close-login-btn:hover{background:rgba(253,187,45,0.15)}

/* ═══════════ CTA BANNER ═══════════ */
.cta-banner{
  margin:20px 32px 10px;
  padding:22px 28px;
  background:linear-gradient(120deg,rgba(155,89,182,0.25),rgba(253,187,45,0.18),rgba(230,126,34,0.22));
  border:1px solid rgba(253,187,45,0.35);
  border-radius:16px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  box-shadow:0 8px 30px rgba(0,0,0,0.35);
  position:relative;
  overflow:hidden;
}
.cta-banner::before{
  content:'';position:absolute;top:-50%;right:-10%;
  width:300px;height:300px;
  background:radial-gradient(circle,rgba(253,187,45,0.25),transparent 70%);
  pointer-events:none;
}
.cta-text{position:relative;z-index:1;flex:1;min-width:240px}
.cta-title{font-size:1.25rem;font-weight:bold;color:#fdbb2d;margin-bottom:6px}
.cta-desc{font-size:0.92rem;opacity:.88;line-height:1.5}
.cta-button{
  position:relative;z-index:1;
  background:linear-gradient(135deg,#2ecc71,#27ae60);
  color:#fff;border:none;
  padding:14px 28px;border-radius:10px;
  font-size:1rem;font-weight:bold;
  cursor:pointer;text-decoration:none;
  transition:all .25s;
  box-shadow:0 4px 14px rgba(46,204,113,0.35);
  white-space:nowrap;
  display:inline-block;
}
.cta-button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(46,204,113,0.5);background:linear-gradient(135deg,#27ae60,#229954)}

/* ═══════════ STATUS ═══════════ */
#status{padding:60px 20px;text-align:center;opacity:.7}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,0.1);border-top-color:#fdbb2d;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════════ SECTIONS ═══════════ */
main{position:relative;z-index:1}
.section{margin:26px 0}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:0 32px;margin-bottom:14px}
.section-title{font-size:1.22rem;font-weight:bold;color:#fdbb2d;display:flex;align-items:center;gap:10px;text-shadow:0 2px 6px rgba(0,0,0,0.35)}
.section-title small{font-size:0.78rem;opacity:.6;color:#fff;font-weight:normal;margin-left:6px}
.carousel-nav{display:flex;gap:6px}
.carousel-nav button{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;width:36px;height:36px;border-radius:50%;
  cursor:pointer;font-size:1.2rem;font-weight:bold;
  transition:all .2s;display:flex;align-items:center;justify-content:center;
  padding-bottom:2px;
}
.carousel-nav button:hover{background:#fdbb2d;color:#000;border-color:#fdbb2d}
.carousel-nav button:disabled{opacity:.25;cursor:not-allowed}

.carousel{
  display:flex;gap:14px;overflow-x:auto;
  padding:6px 32px 16px;
  scroll-behavior:smooth;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.carousel::-webkit-scrollbar{display:none}

/* ═══════════ CARD ═══════════ */
.card{
  flex:0 0 200px;scroll-snap-align:start;
  background:rgba(255,255,255,0.055);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:14px 12px;
  display:flex;flex-direction:column;align-items:center;
  transition:all .25s;position:relative;
}
.card:hover{
  transform:translateY(-4px);
  background:rgba(255,255,255,0.09);
  border-color:rgba(253,187,45,0.45);
  box-shadow:0 14px 28px rgba(0,0,0,0.4);
}
.card-logo{
  width:88px;height:88px;border-radius:12px;object-fit:cover;
  background:#222;
  border:2px solid rgba(255,255,255,0.12);
  margin-bottom:10px;
}
.card-name{
  font-size:0.92rem;font-weight:bold;text-align:center;
  width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  margin-bottom:4px;
}
.card-program{
  font-size:0.76rem;text-align:center;color:#fdbb2d;
  width:100%;height:30px;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  line-height:1.3;opacity:.9;margin-bottom:6px;
}
.card-viewers{font-size:0.72rem;color:#2ecc71;margin-bottom:8px;font-weight:bold;display:flex;align-items:center;gap:5px}
.card-viewers::before{content:'';width:7px;height:7px;background:#e74c3c;border-radius:50%;animation:pulse 1.5s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.card-actions{display:flex;gap:6px;width:100%;margin-top:auto}
.card-actions button,.card-actions a{
  padding:8px 10px;border:none;border-radius:8px;
  font-size:0.82rem;font-weight:bold;cursor:pointer;
  transition:all .2s;text-decoration:none;
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-family:inherit;
}
.fav-btn{
  background:rgba(255,255,255,0.1);color:#fff;
  border:1px solid rgba(255,255,255,0.2)!important;
  flex:0 0 38px!important;padding:8px!important;
}
.fav-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.fav-btn:hover{background:rgba(253,187,45,0.25);border-color:#fdbb2d!important}
.fav-btn.active{background:#fdbb2d;color:#000;border-color:#fdbb2d!important}
.fav-btn.active svg{fill:currentColor}
.fav-btn:disabled{opacity:.4;cursor:not-allowed}
.watch-btn{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;flex:1!important}
.watch-btn svg{width:14px;height:14px;fill:currentColor}
.watch-btn:hover{background:linear-gradient(135deg,#27ae60,#229954);transform:scale(1.02)}
.adult-badge{
  position:absolute;top:8px;right:8px;background:#e74c3c;color:#fff;
  font-size:.65rem;font-weight:bold;padding:2px 6px;border-radius:4px;z-index:2;
}
.empty-msg{padding:12px 32px;font-size:.9rem;opacity:.5;font-style:italic}

/* ═══════════ RESPONSIVE ═══════════ */
@media(max-width:820px){
  header{padding:2px 18px;gap:14px}
  .carousel-nav{display:none !important}
  .logo-header{font-size:1.2rem;gap:10px}
  .logo-header img{width:76px;height:76px}
  .header-right{width:100%;gap:10px}
  .search-box{flex:1;width:auto;min-width:0}
  .cta-banner{margin:16px 18px 8px;padding:18px 20px}
  .cta-title{font-size:1.1rem}
  .section-header{padding:0 18px}
  .carousel{padding:6px 18px 14px}
  .card{flex:0 0 165px;padding:12px 10px}
  .card-logo{width:68px;height:68px}
  .card-name{font-size:.85rem}
  .section-title{font-size:1.05rem}
  .empty-msg{padding:12px 18px}
}
</style>




<!-- __silence_popup_closed__ -->
<script>
(function(){
  var _origAlert = window.alert;
  function isPopupClosed(msg){
    var s = String(msg || '').toLowerCase();
    return s.indexOf('popup-closed-by-user') !== -1
        || s.indexOf('popup has been closed') !== -1
        || s.indexOf('cancelled-popup-request') !== -1
        || s.indexOf('auth/popup') !== -1;
  }
  window.alert = function(msg){
    if (isPopupClosed(msg)) {
      console.log('[Auth] Popup fechado/cancelado — alerta suprimido.');
      return;
    }
    return _origAlert.apply(window, arguments);
  };
})();
</script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAfD0QOlAVb50612u6siwCxzfZfGmgEB2E",
  authDomain: "playtronic-tv.firebaseapp.com",
  projectId: "playtronic-tv",
  storageBucket: "playtronic-tv.firebasestorage.app",
  messagingSenderId: "272337341020",
  appId: "1:272337341020:web:a30d949985fd614b5c7499",
  databaseURL: "https://playtronic-tv-default-rtdb.firebaseio.com"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const rtdb = firebase.database();
const auth = firebase.auth();

const DEFAULT_LOGO = "https://raw.githubusercontent.com/Playtronic/tv/refs/heads/main/template/logotv.png";
const CATEGORY_NAMES = {
  noticias:'Notícias', esportes:'Esportes', filmes:'Filmes', series:'Séries',
  novelas:'Novelas', animes:'Animes e Tokusatsus', desenhos:'Desenhos Animados',
  infantil:'Infantil', documentarios:'Documentários', musica:'Música',
  variedades:'Variedades', humor:'Humor', games:'Games', religioso:'Religioso',
  retransmissoes:'Retransmissões', adulto:'Adulto (18+)', outros:'Outros'
};

let allChannels = [];
let favorites = [];           // array de channelIds
let searchTerm = '';
let currentUser = null;
let favoritesLoaded = false;  // garante que só renderiza favoritos depois de carregar

/* ═══════════ AUTH ═══════════ */
function setupAuth(){
  auth.onAuthStateChanged(async user => {
    currentUser = user;
    const loginBtn = document.getElementById('loginButton');
    const userInfo = document.getElementById('userInfo');

    if (user) {
      loginBtn.style.display = 'none';
      userInfo.classList.add('active');
      document.getElementById('userAvatar').src = user.photoURL || 'https://www.gravatar.com/avatar/?d=mp';
      document.getElementById('userName').textContent = user.displayName || 'Usuário';
      document.getElementById('userEmail').textContent = user.email || '';

      await loadFavoritesFromAccount();
    } else {
      loginBtn.style.display = 'inline-block';
      userInfo.classList.remove('active');
      document.getElementById('userCard').classList.remove('active');

      favorites = [];
      favoritesLoaded = true;
      render();
    }
  });
}

/* ═══════════ FAVORITOS (na conta) ═══════════ */
async function loadFavoritesFromAccount(){
  if (!currentUser) { favorites = []; favoritesLoaded = true; render(); return; }
  try {
    const ref = db.collection('users').doc(currentUser.uid)
      .collection('preferences').doc('favorites');
    const snap = await ref.get();
    if (snap.exists) {
      const d = snap.data() || {};
      favorites = Array.isArray(d.channelIds) ? d.channelIds.slice() : [];
    } else {
      favorites = [];
    }
    favoritesLoaded = true;
    render();
  } catch(e){
    console.warn('Erro ao carregar favoritos:', e.message);
    favorites = [];
    favoritesLoaded = true;
    render();
  }
}

async function saveFavoritesToAccount(){
  if (!currentUser) return;
  try {
    const ref = db.collection('users').doc(currentUser.uid)
      .collection('preferences').doc('favorites');
    await ref.set({
      channelIds: favorites.slice(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch(e){
    console.warn('Erro ao salvar favoritos:', e.message);
    // Reverte otimisticamente
    alert('Erro ao salvar favoritos. Tente novamente.');
  }
}

function isFavorite(id){ return favorites.indexOf(id) !== -1; }

async function toggleFavorite(id, btn){
  if (!currentUser) {
    // Abre modal de login
    document.getElementById('loginOverlay').classList.add('active');
    return;
  }

  if (btn) btn.disabled = true;

  const i = favorites.indexOf(id);
  const adding = i === -1;

  // Atualização otimista na UI
  if (adding) favorites.push(id); else favorites.splice(i, 1);
  render();

  // Persiste
  await saveFavoritesToAccount();
}

/* ═══════════ LOGIN MODAL ═══════════ */
document.getElementById('loginButton').addEventListener('click', () => {
  document.getElementById('loginOverlay').classList.add('active');
});
document.getElementById('closeLoginBtn').addEventListener('click', () => {
  document.getElementById('loginOverlay').classList.remove('active');
});
document.getElementById('googleLoginBtn').addEventListener('click', async () => {
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.addScope('profile'); provider.addScope('email');
        provider.setCustomParameters({ prompt: 'select_account' });
    await auth.signInWithPopup(provider);
    document.getElementById('loginOverlay').classList.remove('active');
  } catch(e){ alert('Erro no login: ' + e.message); }
});
document.getElementById('logoutButton').addEventListener('click', () => {
  auth.signOut().then(() => document.getElementById('userCard').classList.remove('active'));
});
document.getElementById('userAvatar').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('userCard').classList.toggle('active');
});
document.addEventListener('click', e => {
  const card = document.getElementById('userCard');
  const av = document.getElementById('userAvatar');
  if (card && card.classList.contains('active') && !card.contains(e.target) && e.target !== av){
    card.classList.remove('active');
  }
});

/* ═══════════ HELPERS ═══════════ */
function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getCurrentProgram(c){
  const names = c.programNames;
  if (!names || names.length === 0) return c.slogan || 'Programação ao vivo';
  const SLOT = 25;
  const now = new Date();
  let idx = 0;
  if (c.programmingMode === 'playlist' && c.releaseDate){
    const p = String(c.releaseDate).split('-').map(Number);
    if (p.length === 3 && !isNaN(p[0])){
      const rel = new Date(p[0], p[1]-1, p[2], 6, 0, 0, 0);
      const d = Math.floor((now.getTime() - rel.getTime()) / 60000);
      if (d >= 0) idx = Math.floor(d / SLOT);
    }
  } else {
    const a = new Date(now);
    if (a.getHours() < 6) a.setDate(a.getDate() - 1);
    a.setHours(6,0,0,0);
    const d = Math.floor((now.getTime() - a.getTime()) / 60000);
    idx = Math.floor(d / SLOT);
  }
  return names[idx % names.length] || names[0];
}

/* ═══════════ CARREGAMENTO ═══════════ */
async function loadAll(){
  const statusEl = document.getElementById('status');
  statusEl.style.display = 'block';
  statusEl.innerHTML = '<div class="spinner"></div><p>Carregando canais...</p>';
  try {
    const snap = await db.collection('channels').get();
    const channels = [];
    snap.forEach(doc => {
      const d = doc.data();
      if (d.isOffline === true) return;
      if (!d.url) return;
      channels.push({
        id: doc.id,
        name: d.name || 'Sem nome',
        slogan: d.slogan || '',
        logo: d.logo || DEFAULT_LOGO,
        category: d.category || 'outros',
        url: d.url,
        isAdultContent: !!d.isAdultContent,
        programmingMode: d.programmingMode || 'grade',
        releaseDate: d.releaseDate || '',
        programNames: Array.isArray(d.programNames) ? d.programNames : [],
        createdAt: d.createdAt ? (d.createdAt.toMillis ? d.createdAt.toMillis() : Number(d.createdAt)) : 0,
        updatedAt: d.updatedAt ? (d.updatedAt.toMillis ? d.updatedAt.toMillis() : Number(d.updatedAt)) : 0,
        onlineCount: 0, likes: 0, dislikes: 0, totalVotes: 0
      });
    });

    await Promise.all(channels.map(async c => {
      try {
        const s = await rtdb.ref('onlineUsers/' + c.id).once('value');
        if (s.exists()){
          const v = s.val(); const now = Date.now(); let cnt = 0;
          Object.keys(v).forEach(k => {
            const viewer = v[k]; if (!viewer) return;
            const hb = viewer.lastHeartbeat || viewer.timestamp || 0;
            if (now - hb < 90000) cnt++;
          });
          c.onlineCount = cnt;
        }
      } catch(e){}
    }));

    await Promise.all(channels.map(async c => {
      try {
        const s = await rtdb.ref('channelStats/' + c.id).once('value');
        if (s.exists()){
          const v = s.val() || {};
          c.likes = Number(v.likes) || 0;
          c.dislikes = Number(v.dislikes) || 0;
          c.totalVotes = c.likes + c.dislikes;
        }
      } catch(e){}
    }));

    allChannels = channels;
    render();
    statusEl.style.display = 'none';

    setInterval(refreshOnlineCounts, 60000);
  } catch(e){
    console.error(e);
    statusEl.innerHTML = '<p style="color:#ef4444">Erro ao carregar canais. Recarregue a página.</p>';
  }
}

async function refreshOnlineCounts(){
  await Promise.all(allChannels.map(async c => {
    try {
      const s = await rtdb.ref('onlineUsers/' + c.id).once('value');
      let cnt = 0;
      if (s.exists()){
        const v = s.val(); const now = Date.now();
        Object.keys(v).forEach(k => {
          const viewer = v[k]; if (!viewer) return;
          const hb = viewer.lastHeartbeat || viewer.timestamp || 0;
          if (now - hb < 90000) cnt++;
        });
      }
      c.onlineCount = cnt;
    } catch(e){}
  }));
  render();
}

function matchesSearch(c){
  if (!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  return c.name.toLowerCase().includes(t)
      || (c.slogan || '').toLowerCase().includes(t)
      || (CATEGORY_NAMES[c.category] || '').toLowerCase().includes(t);
}

/* ═══════════ CARDS ═══════════ */
const ICON_HEART = '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

function makeCard(c){
  const fav = isFavorite(c.id);
  const badge = c.isAdultContent ? '<div class="adult-badge">18+</div>' : '';
  const viewers = c.onlineCount > 0 ? `<div class="card-viewers">${c.onlineCount} assistindo</div>` : '';
  const program = getCurrentProgram(c);
  return `
    <div class="card">
      ${badge}
      <img class="card-logo" src="${escapeHtml(c.logo)}" alt="${escapeHtml(c.name)}"
           onerror="this.onerror=null;this.src='${DEFAULT_LOGO}';">
      <div class="card-name" title="${escapeHtml(c.name)}">${escapeHtml(c.name)}</div>
      <div class="card-program" title="${escapeHtml(program)}">${escapeHtml(program)}</div>
      ${viewers}
      <div class="card-actions">
        <button class="fav-btn ${fav?'active':''}" data-fav="${escapeHtml(c.id)}" title="${fav?'Remover dos favoritos':'Adicionar aos favoritos'}">${ICON_HEART}</button>
        <a class="watch-btn" href="${escapeHtml(c.url)}" target="_blank" rel="noopener">${ICON_PLAY} Assistir</a>
      </div>
    </div>`;
}

function makeSection(title, channels, opts){
  opts = opts || {};
  if (!channels || channels.length === 0){
    if (opts.hideIfEmpty) return '';
    return `<section class="section">
      <div class="section-header"><div class="section-title">${escapeHtml(title)}</div></div>
      <div class="empty-msg">${opts.emptyMsg || 'Nenhum canal nesta seção.'}</div>
    </section>`;
  }
  const cards = channels.map(makeCard).join('');
  const cnt = opts.countLabel ? `<small>${channels.length} canal${channels.length!==1?'s':''}</small>` : '';
  const showNav = channels.length >= 8;
  const navHtml = showNav
    ? `<div class="carousel-nav">
        <button data-scroll="left" data-target="sec-${escapeHtml(opts.key)}" aria-label="Anterior">&lsaquo;</button>
        <button data-scroll="right" data-target="sec-${escapeHtml(opts.key)}" aria-label="Próximo">&rsaquo;</button>
      </div>`
    : '';
  return `<section class="section">
    <div class="section-header">
      <div class="section-title">${escapeHtml(title)}${cnt}</div>
      ${navHtml}
    </div>
    <div class="carousel" id="sec-${escapeHtml(opts.key)}">${cards}</div>
  </section>`;
}

/* ═══════════ RENDER ═══════════ */
function render(){
  const main = document.getElementById('main');
  const visible = allChannels.filter(matchesSearch);

  if (visible.length === 0){
    main.innerHTML = `<div style="padding:60px 20px;text-align:center;opacity:.6"><p>Nenhum canal encontrado.</p></div>`;
    return;
  }

  const now = Date.now();
  const DAY = 24*60*60*1000;

  const favChannels = visible.filter(c => isFavorite(c.id));

  const online = visible.filter(c => c.onlineCount > 0)
    .sort((a,b) => b.onlineCount - a.onlineCount).slice(0,20);

  const topRated = visible.filter(c => c.totalVotes >= 5)
    .sort((a,b) => {
      const ra = a.likes/a.totalVotes, rb = b.likes/b.totalVotes;
      if (rb !== ra) return rb - ra;
      return b.totalVotes - a.totalVotes;
    }).slice(0,20);

  const newChannels = visible.filter(c => c.createdAt > 0 && (now - c.createdAt) < 30*DAY)
    .sort((a,b) => b.createdAt - a.createdAt).slice(0,20);

  const byCategory = {};
  visible.forEach(c => {
    const cat = c.category || 'outros';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(c);
  });

  const abandoned = visible.filter(c => {
    if (c.onlineCount > 0) return false;
    if (c.totalVotes > 0) return false;
    const ref = c.createdAt > 0 ? c.createdAt : c.updatedAt;
    if (!ref) return false;
    return (now - ref) > 3*DAY;
  }).slice(0,20);

  let html = '';

  if (searchTerm){
    if (favChannels.length > 0){
      html += makeSection('Seus Favoritos', favChannels, { key:'fav-s', countLabel:true });
    }
    html += makeSection(`Resultados: "${searchTerm}"`, visible, { key:'search', countLabel:true });
    main.innerHTML = html;
    wireEvents(main);
    return;
  }

  // Fileira 1: Favoritos
  if (!currentUser){
    html += `<section class="section">
      <div class="section-header"><div class="section-title">Seus Favoritos</div></div>
      <div class="empty-msg">Faça login para salvar seus favoritos e acessá-los em qualquer dispositivo.</div>
    </section>`;
  } else if (favChannels.length > 0){
    html += makeSection('Seus Favoritos', favChannels, { key:'favorites', countLabel:true });
  } else {
    html += `<section class="section">
      <div class="section-header"><div class="section-title">Seus Favoritos</div></div>
      <div class="empty-msg">Clique no coração de qualquer canal para adicioná-lo aos seus favoritos.</div>
    </section>`;
  }

  html += makeSection('Assistindo Agora', online, { key:'online', hideIfEmpty:true, countLabel:true });
  html += makeSection('Melhores Avaliados', topRated, { key:'top', hideIfEmpty:true, countLabel:true });
  html += makeSection('Novos Canais', newChannels, { key:'new', hideIfEmpty:true, countLabel:true });

  Object.keys(CATEGORY_NAMES).forEach(cat => {
    const list = byCategory[cat];
    if (!list || list.length === 0) return;
    html += makeSection(CATEGORY_NAMES[cat], list, { key:'cat-'+cat, countLabel:true });
  });

  html += makeSection('Canais Esquecidos', abandoned, { key:'abandoned', hideIfEmpty:true, countLabel:true });

  main.innerHTML = html;
  wireEvents(main);
}

function wireEvents(main){
  main.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      toggleFavorite(btn.getAttribute('data-fav'), btn);
    });
  });
  main.querySelectorAll('.carousel-nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-target');
      const car = document.getElementById(id);
      if (!car) return;
      const dir = btn.getAttribute('data-scroll') === 'right' ? 1 : -1;
      car.scrollBy({ left: dir * 450, behavior: 'smooth' });
    });
  });
  setTimeout(updateNavButtons, 100);
  main.querySelectorAll('.carousel').forEach(c => c.addEventListener('scroll', updateNavButtons));
}

function updateNavButtons(){
  document.querySelectorAll('.carousel').forEach(car => {
    const nav = document.querySelector(`.carousel-nav [data-target="${car.id}"]`);
    if (!nav) return;
    const p = nav.parentElement;
    const l = p.querySelector('[data-scroll="left"]');
    const r = p.querySelector('[data-scroll="right"]');
    if (!l || !r) return;
    l.disabled = car.scrollLeft <= 5;
    r.disabled = car.scrollLeft + car.clientWidth >= car.scrollWidth - 5;
  });
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.trim();
  render();
});

/* ═══════════ START ═══════════ */
setupAuth();
loadAll();
</script>
